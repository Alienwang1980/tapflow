name: Bug report
description: Something is broken — help us fix it
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more detail, the faster we can fix it.
  - type: input
    id: version
    attributes:
      label: Tapflow version
      description: e.g. v1.0.5 (shown in the menu bar tray menu)
      placeholder: v1.0.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel on iPad
        2. Press a key
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Screenshots, browser type (Safari/Chrome), network setup, anything else that helps
