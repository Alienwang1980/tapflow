<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Tapflow 宣发帖预览 & 图片校对</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  header { background: #1a1a2e; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .hint { font-size: 12px; color: #9aa4b8; }
  #save-status { font-size: 13px; color: #7ee787; opacity: 0; transition: opacity .3s; }
  #save-status.show { opacity: 1; }
  .wrap { max-width: 860px; margin: 20px auto; padding: 0 16px; }
  section { background: #fff; border-radius: 10px; padding: 20px 24px; margin-bottom: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  section h2 { font-size: 15px; margin: 0 0 14px; color: #555; border-bottom: 1px solid #eee; padding-bottom: 10px; }
  .post-title { font-size: 20px; font-weight: 700; margin: 4px 0 14px; }
  .block-text { line-height: 1.75; margin: 12px 0; white-space: pre-wrap; }
  .block-h2 { font-size: 18px; font-weight: 700; margin: 20px 0 8px; }
  .block-h3 { font-size: 16px; font-weight: 600; margin: 16px 0 6px; }
  .img-row { margin: 14px 0; padding: 12px; background: #fafbfc; border: 1px solid #e8eaed; border-radius: 8px; }
  .img-row > img { max-width: 100%; border-radius: 6px; display: block; margin-bottom: 8px; }
  .img-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .img-controls .thumb-preview { width: 56px; height: 40px; object-fit: cover; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
  .img-controls .slot-tag { background: #eef1f6; color: #556; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .img-controls .fname { color: #555; }
  .img-controls button { padding: 5px 12px; border: 1px solid #3b82f6; background: #fff; color: #3b82f6; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .img-controls button:hover { background: #eff6ff; }
  pre { background: #fafbfc; border: 1px solid #e8eaed; border-radius: 8px; padding: 14px; overflow-x: auto; white-space: pre-wrap; font-size: 13px; line-height: 1.6; }

  /* 缩略图选择面板 */
  .picker { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 100; }
  .picker.show { display: flex; }
  .picker-inner { margin: auto; background: #fff; border-radius: 10px; padding: 16px; width: min(900px, 94vw); max-height: 86vh; display: flex; flex-direction: column; }
  .picker-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .picker-head b { font-size: 15px; }
  .picker-head button { border: none; background: none; font-size: 20px; cursor: pointer; color: #888; }
  .picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; overflow-y: auto; }
  .pick-item { border: 2px solid transparent; border-radius: 8px; padding: 6px; cursor: pointer; text-align: center; background: #fafbfc; }
  .pick-item:hover { background: #eef4ff; }
  .pick-item img { width: 100%; height: 88px; object-fit: cover; border-radius: 6px; display: block; }
  .pick-item .k { font-size: 11px; color: #555; word-break: break-all; margin-top: 4px; }
  .pick-item.active { border-color: #3b82f6; background: #eff6ff; }
</style>
</head>
<body>
<header>
  <h1>Tapflow 宣发帖预览 & 图片校对</h1>
  <span class="hint">正文只改 draft.md 一个文件;换图点图片下方缩略图或「换图」</span>
  <span id="save-status">已保存 ✓</span>
</header>
<div class="wrap">
  <section id="sec-v2ex"></section>
  <section id="sec-2libra"></section>
  <section id="sec-zfrontier"></section>
  <section id="sec-reddit"></section>
  <section id="sec-hn"><h2>hn.txt(HN Show HN,纯文本无图)</h2><pre id="hn-pre">加载中…</pre></section>
</div>

<div class="picker" id="picker">
  <div class="picker-inner">
    <div class="picker-head">
      <b id="picker-title">选择图片</b>
      <button id="picker-close" title="关闭">✕</button>
    </div>
    <div class="picker-grid" id="picker-grid"></div>
  </div>
</div>

<script>
const BASE = 'https://img.tapflow.work';
let mapping = {}, manifest = {}, structure = null;
let pickerSlot = null;
const sortedKeys = [];

async function load() {
  [structure, mapping, manifest] = await Promise.all([
    fetch('/structure').then(r => r.json()),
    fetch('/mapping.json').then(r => r.json()),
    fetch('/manifest.json').then(r => r.json()),
  ]);
  document.getElementById('hn-pre').textContent = structure.hn;
  sortedKeys.push(...Object.keys(manifest).sort((a, b) => {
    const ta = a.startsWith('tapflow-'), tb = b.startsWith('tapflow-');
    if (ta !== tb) return ta ? -1 : 1;
    return a < b ? -1 : 1;
  }));
  render();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function refreshSlotUI(slot) {
  // 同一槽位在 v2ex/2libra/reddit 各出现一次,全部刷新
  document.querySelectorAll(`[data-slot="${slot}"]`).forEach(row => {
    row.querySelector('.slot-img').src = `${BASE}/${mapping[slot]}`;
    row.querySelector('.thumb-preview').src = `/thumb/${encodeURIComponent(mapping[slot])}`;
    row.querySelector('.fname').textContent = mapping[slot];
  });
}

function imgBlock(slot) {
  const row = el('div', 'img-row');
  row.dataset.slot = slot;
  const img = document.createElement('img');
  img.className = 'slot-img';
  img.src = `${BASE}/${mapping[slot]}`;
  img.alt = slot;
  row.appendChild(img);

  const ctrl = el('div', 'img-controls');
  const thumb = document.createElement('img');
  thumb.className = 'thumb-preview';
  thumb.src = `/thumb/${encodeURIComponent(mapping[slot])}`;
  thumb.alt = slot;
  ctrl.appendChild(thumb);
  ctrl.appendChild(el('span', 'slot-tag', slot));
  ctrl.appendChild(el('span', 'fname', mapping[slot]));
  const btn = el('button', '', '换图');
  const open = () => openPicker(slot);
  thumb.addEventListener('click', open);
  btn.addEventListener('click', open);
  ctrl.appendChild(btn);
  row.appendChild(ctrl);
  return row;
}

async function save() {
  const st = document.getElementById('save-status');
  try {
    const r = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(mapping),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    st.textContent = '已保存 ✓';
    st.style.color = '#7ee787';
    st.classList.add('show');
    clearTimeout(save._t);
    save._t = setTimeout(() => st.classList.remove('show'), 1500);
  } catch (e) {
    st.textContent = '保存失败!请确认 save_server.py 正在运行';
    st.style.color = '#f66';
    st.classList.add('show');
  }
}

/* ---- 缩略图选择面板 ---- */
function updateActive() {
  document.querySelectorAll('.pick-item').forEach(item => {
    item.classList.toggle('active', item.dataset.key === mapping[pickerSlot]);
  });
}

function openPicker(slot) {
  pickerSlot = slot;
  document.getElementById('picker-title').textContent = `为 ${slot} 选择图片(点击即换并保存)`;
  const grid = document.getElementById('picker-grid');
  if (grid.dataset.built !== '1') {
    grid.dataset.built = '1';
    for (const k of sortedKeys) {
      const item = el('div', 'pick-item');
      item.dataset.key = k;
      const im = document.createElement('img');
      im.src = `/thumb/${encodeURIComponent(k)}`;
      im.loading = 'lazy';
      im.alt = k;
      item.appendChild(im);
      item.appendChild(el('div', 'k', k));
      item.addEventListener('click', async () => {
        mapping[pickerSlot] = k;
        document.getElementById('picker').classList.remove('show');
        refreshSlotUI(pickerSlot);
        await save();
      });
      grid.appendChild(item);
    }
  }
  updateActive();
  document.getElementById('picker').classList.add('show');
}

document.getElementById('picker-close').addEventListener('click', () => {
  document.getElementById('picker').classList.remove('show');
});
document.getElementById('picker').addEventListener('click', e => {
  if (e.target.id === 'picker') document.getElementById('picker').classList.remove('show');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('picker').classList.remove('show');
});

function renderPost(containerId, platform, lang) {
  const sec = document.getElementById(containerId);
  sec.innerHTML = '';
  sec.appendChild(el('h2', '', platform));
  sec.appendChild(el('div', 'post-title', structure.titles[platform]));
  for (const b of structure.blocks) {
    if (b.type === 'text') sec.appendChild(el('div', 'block-text', b[lang]));
    else if (b.type === 'h2') sec.appendChild(el('div', 'block-h2', b[lang]));
    else if (b.type === 'h3') sec.appendChild(el('div', 'block-h3', b[lang]));
    else if (b.type === 'img') sec.appendChild(imgBlock(b.slot));
  }
}

function linkifyBBCode(text) {
  return text.replace(/https?:\/\/[^\s。，、;；!！"'<>()\[\]{}]+/g, '[url]$&[/url]');
}

function bbcodeBody() {
  const out = [];
  for (const b of structure.blocks) {
    if (b.type === 'text') out.push(linkifyBBCode(b.zh));
    else if (b.type === 'h2') out.push('[size=5][b]' + b.zh + '[/b][/size]');
    else if (b.type === 'h3') out.push('[size=4][b]' + b.zh + '[/b][/size]');
    else if (b.type === 'img') out.push('[img]' + BASE + '/' + mapping[b.slot] + '[/img]');
  }
  return out.join('\n\n');
}

function renderPostBBCode(containerId) {
  const sec = document.getElementById(containerId);
  sec.innerHTML = '';
  sec.appendChild(el('h2', '', 'zfrontier · BBCode 代码(直接复制)'));
  sec.appendChild(el('div', 'post-title', structure.titles.zfrontier));
  sec.appendChild(el('pre', '', bbcodeBody()));
}

function render() {
  renderPost('sec-v2ex', 'v2ex', 'zh');
  renderPost('sec-2libra', '2libra', 'zh');
  renderPostBBCode('sec-zfrontier');
  renderPost('sec-reddit', 'reddit', 'en');
}

load().catch(e => {
  document.body.innerHTML = '<p style="padding:40px">加载失败:' + e + '<br>请确认 save_server.py 正在运行,并刷新本页。</p>';
});
</script>
</body>
</html>
