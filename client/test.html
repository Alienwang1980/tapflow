<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>STP Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#1a1a2e;font-family:sans-serif}
body{position:relative}
.key-btn{position:absolute;border:none;border-radius:5px;color:#eee;font-size:14px;display:flex;align-items:center;justify-content:center}
.info{position:fixed;bottom:10px;left:10px;color:#888;font-size:11px;z-index:99;background:rgba(0,0,0,0.8);padding:6px 10px;border-radius:4px}
</style></head>
<body>
<div id="info" class="info"></div>
<script>
// === HARDCODED render — no WebSocket, no profile fetch ===
const profile = {
  deviceWidth:834, deviceHeight:1210, cellSize:60, canvasX:0, canvasY:0,
  pages:[{id:"main",keys:[
    {id:"k1",label:"←",col:0,row:0,w:1,h:1,color:"#e94560"},
    {id:"k2",label:"↓",col:1,row:0,w:1,h:1,color:"#3a7ca5"},
    {id:"k3",label:"→",col:2,row:0,w:1,h:1,color:"#e94560"},
    {id:"k4",label:"↑",col:3,row:0,w:1,h:1,color:"#3a7ca5"},
    {id:"s1",label:"SPACE",col:0,row:2,w:4,h:1,color:"#555"},
  ]}]
};

const pg=profile.pages[0];
const dw=profile.deviceWidth,dh=profile.deviceHeight,cs=profile.cellSize;
const cx=profile.canvasX,cy=profile.canvasY;

// Use viewport dimensions
const vw=window.innerWidth,vh=window.innerHeight;
const scale=Math.min(vw/dw,vh/dh);
const ox=(vw-dw*scale)/2,oy=(vh-dh*scale)/2;
const cx_cells=cx/60,cy_cells=cy/60;
const padX=dw/(2*cs),padY=dh/(2*cs);

let visible=0;
pg.keys.forEach(k=>{
  const x=ox+(k.col-cx_cells+padX)*cs*scale;
  const y=oy+(k.row-cy_cells+padY)*cs*scale;
  const kw=k.w*cs*scale,kh=k.h*cs*scale;
  if(x+kw>0&&y+kh>0&&x<vw&&y<vh)visible++;
  const el=document.createElement("div");
  el.className="key-btn";
  el.style.cssText=`left:${x}px;top:${y}px;width:${kw}px;height:${kh}px;background:${k.color}`;
  el.textContent=k.label;
  document.body.appendChild(el);
});

document.getElementById("info").textContent=
  `vw=${vw} vh=${vh} scale=${scale.toFixed(2)} ox=${ox.toFixed(0)} oy=${oy.toFixed(0)} padX=${padX.toFixed(1)} padY=${padY.toFixed(1)} | visible: ${visible}/${pg.keys.length}`;
</script>
</body></html>
