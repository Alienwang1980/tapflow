<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>Tapflow Diag</title><style>
:root{--saT:env(safe-area-inset-top);--saB:env(safe-area-inset-bottom);--saL:env(safe-area-inset-left);--saR:env(safe-area-inset-right)}
body{background:#101418;color:#7ee787;font:15px/1.7 ui-monospace,Menlo,monospace;padding:16px;margin:0;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
#d{min-height:100vh}
.refresh{position:fixed;bottom:12px;right:12px;background:#1f6feb;color:#fff;border:none;border-radius:8px;padding:10px 16px;font:bold 14px/1 ui-monospace,monospace}
</style></head><body>
<div id="d">loading…</div>
<button class="refresh" onclick="dump()">refresh</button>
<script>
var vv=window.visualViewport||null;
function dump(){
  var rs=getComputedStyle(document.documentElement);
  var safe={
    top:parseFloat(rs.getPropertyValue("--saT"))||0,
    bottom:parseFloat(rs.getPropertyValue("--saB"))||0,
    left:parseFloat(rs.getPropertyValue("--saL"))||0,
    right:parseFloat(rs.getPropertyValue("--saR"))||0
  };
  var vh100=document.documentElement.clientHeight;
  var o=document.createElement("div");
  o.style.cssText="position:fixed;top:0;left:0;width:100vw;height:100vh;border:2px solid red;pointer-events:none";
  document.body.appendChild(o);
  var vhRect=o.getBoundingClientRect();
  o.remove();
  var o2=document.createElement("div");
  o2.style.cssText="position:fixed;top:0;left:0;width:2px;height:100svh;border:2px solid blue;pointer-events:none";
  document.body.appendChild(o2);
  var svhRect=o2.getBoundingClientRect();
  o2.remove();
  var out={};
  out.time=new Date().toLocaleTimeString();
  out.ua=navigator.userAgent;
  out.dpr=devicePixelRatio;
  out.innerW=innerWidth;out.innerH=innerHeight;
  out.docClientH=vh100;
  out.svhHeight=svhRect.height;
  out.vh100RectW=vhRect.width+" × h="+vhRect.height;
  out.visualViewport=vv?{w:vv.width,h:vv.height,scale:vv.scale,offsetTop:vv.offsetTop,offsetLeft:vv.offsetLeft}:"none";
  out.safeArea=safe;
  out.screenAvail=screen.width+"×"+screen.availHeight;
  out.orientation=(screen.orientation||{}).type;
  out.zoomed = (innerWidth/vv.width)!==1 ? "layoutW != visualW (zoom active)" : "1:1";
  document.getElementById("d").textContent=JSON.stringify(out,null,2);
}
window.addEventListener("resize",function(){setTimeout(dump,100)});
window.addEventListener("orientationchange",function(){setTimeout(dump,400)});
dump();
</script>
</body></html>
