<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Touch Panel — Editor</title>
<style>
:root {
  --bg:#1a1a2e; --panel:#16213e; --card:#0f3460;
  --accent:#e94560; --text:#eee; --dim:#888; --border:#2a2a4a;
  --green:#3a7ca5; --red:#8b3a3a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column}

/* Toolbar */
.tb{display:flex;align-items:center;gap:8px;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--border);height:38px;flex-shrink:0}
.tb h1{font-size:14px}.tb h1 span{color:var(--accent)}
.tb .conn{font-size:10px;padding:1px 6px;border-radius:3px}
.tb .conn.on{background:#4caf5040;color:#4caf50}
.tb .conn.off{background:#f4433640;color:#f44336}
.tb button,.tb select{padding:3px 8px;border-radius:3px;border:1px solid var(--border);cursor:pointer;font-size:11px;background:var(--card);color:var(--text)}
.tb .btn-save{background:var(--green);color:#fff;border-color:var(--green)}
.tb .btn-new{background:#555;color:#fff}

/* Layout */
.main{display:flex;flex:1;overflow:hidden}
.side{width:200px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto}
.side h3{font-size:10px;text-transform:uppercase;color:var(--dim);padding:8px 8px 2px;letter-spacing:1px}
.side .it{padding:4px 8px;cursor:pointer;font-size:11px;border-left:3px solid transparent;display:flex;justify-content:space-between}
.side .it:hover{background:#ffffff08}
.side .it.ac{border-left-color:var(--accent);color:var(--accent);background:#ffffff0c}
.side .it .x{visibility:hidden;color:var(--red);cursor:pointer;font-size:13px}
.side .it:hover .x{visibility:visible}
.side .ar{display:flex;gap:3px;padding:3px 8px}
.side .ar input{flex:1;padding:2px 5px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:3px;font-size:10px}
.side .ar button{padding:2px 5px;font-size:10px;background:#555;color:#fff;border:none;border-radius:3px;cursor:pointer}

/* Center grid */
.ctr{flex:1;display:flex;flex-direction:column;overflow:hidden}
.gtb{display:flex;align-items:center;gap:8px;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--border)}
.gtb label{font-size:10px;color:var(--dim)}
.gtb .stepper{display:flex;align-items:center;gap:2px}
.gtb .stepper button{width:22px;height:22px;font-size:14px;line-height:1;text-align:center;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:3px;cursor:pointer}
.gtb .stepper span{width:28px;text-align:center;font-size:12px;font-weight:600}
.gtb .hint{font-size:9px;color:var(--dim);margin-left:auto}

.gsw{flex:1;overflow:auto;padding:6px}
.eg{
  display:grid;gap:2px;position:relative;
  min-height:400px;
  background:rgba(0,0,0,0.4);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:6px;padding:4px;
}

/* Grid cells */
.gc{
  background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.3);
  border-radius:3px;min-height:28px;cursor:pointer;position:relative;
}
.gc:hover{background:rgba(233,69,96,0.12);border-color:var(--accent);border-style:solid}
.gc .cl{position:absolute;top:0;left:2px;font-size:7px;color:rgba(255,255,255,0.25);pointer-events:none}

/* Keys */
.gk{
  background:var(--card);border:2px solid transparent;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:500;cursor:grab;position:relative;
  transition:border-color 0.1s;user-select:none;z-index:2;overflow:hidden;
}
.gk:hover{border-color:rgba(255,255,255,0.4)}
.gk.sel{border-color:var(--accent);box-shadow:0 0 8px rgba(233,69,96,0.5);cursor:default}
.gk.drag{opacity:0.35}
.gk .kl{pointer-events:none;text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gk .rh{
  position:absolute;bottom:0;right:0;width:12px;height:12px;
  cursor:se-resize;opacity:0;
  background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,0.4) 50%);
  border-radius:0 0 4px 0;
}
.gk:hover .rh,.gk.sel .rh{opacity:1}
.gk .sz{position:absolute;top:1px;right:3px;font-size:7px;color:rgba(255,255,255,0.35);pointer-events:none}

/* Right panel */
.rp{width:260px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:10px}
.rp h3{font-size:12px;margin-bottom:8px}
.rp label{display:block;font-size:10px;color:var(--dim);margin:6px 0 2px}
.rp input,.rp select{width:100%;padding:4px 6px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:3px;font-size:11px}
.rp input[type=color]{height:26px;padding:1px}
.rp .rw{display:flex;gap:4px}
.rp .rw>div{flex:1}
.rp .rw input{width:100%}
.rp .stepper{display:flex;align-items:center;gap:2px}
.rp .stepper button{width:24px;height:24px;font-size:14px;line-height:1;text-align:center;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:3px;cursor:pointer}
.rp .stepper span{width:24px;text-align:center;font-size:13px;font-weight:600}
.rp .hint{font-size:9px;color:var(--dim);margin-top:1px}
.rp .br{display:flex;gap:4px;margin-top:8px}
.rp .br button{flex:1;padding:5px;font-size:11px;cursor:pointer;border-radius:3px}
.rp .btn-del{background:var(--red);color:#fff;border:none}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:6px 16px;border-radius:5px;font-size:12px;z-index:999;opacity:0;transition:opacity 0.3s}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
</style>
</head>
<body>

<div class="tb">
  <h1>Smart <span>Touch</span> Editor</h1>
  <span class="conn off" id="cs">off</span>
  <select id="gs" onchange="if(profile){profile.defaultSound=this.value;dirty=true}" style="width:auto;font-size:10px">
    <option value="none">Sound:None</option><option value="click">Sound:Click</option>
    <option value="soft">Sound:Soft</option><option value="mechanical">Sound:Mechanical</option><option value="deep">Sound:Deep</option>
  </select>
  <button class="btn-save" onclick="saveProfile()">Save & Sync</button>
  <button class="btn-new" onclick="newProfile()">+ New</button>
  <span style="font-size:10px;color:var(--dim);margin-left:auto" id="st"></span>
</div>

<div class="main">
<div class="side">
  <h3>Profiles</h3><div id="pl"></div>
  <div class="ar"><input id="npn" placeholder="Name"><button onclick="createProfile()">+</button></div>
  <h3>Pages</h3><div id="pgl"></div>
  <div class="ar"><input id="npl" placeholder="Label"><button onclick="addPage()">+</button></div>
</div>

<div class="ctr">
  <div class="gtb">
    <div class="stepper"><label>Cols</label><button onclick="chgGrid('columns',-1)">−</button><span id="gcv">15</span><button onclick="chgGrid('columns',1)">+</button></div>
    <div class="stepper"><label>Rows</label><button onclick="chgGrid('rows',-1)">−</button><span id="grv">15</span><button onclick="chgGrid('rows',1)">+</button></div>
    <span class="hint">Drag keys to move/swap. Drag corner to resize. Click cell to add.</span>
  </div>
  <div class="gsw"><div class="eg" id="eg"></div></div>
</div>

<div class="rp" id="rp">
  <h3>Key Properties</h3>
  <div id="pc"><p style="font-size:11px;color:var(--dim)">Click a key to edit<br>or click empty cell to add</p></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
let ws=null,profile=null,profiles=[],activePage="",activeProfile="Default.json";
let selKey=null,dragKey=null,dragOcc=null,resizing=null,dirty=false;

// ── WebSocket ──
function cws(){
  ws=new WebSocket("ws://"+location.hostname+":8082/ws");
  ws.onopen=()=>{document.getElementById("cs").textContent="connected";document.getElementById("cs").className="conn on"}
  ws.onclose=()=>{document.getElementById("cs").textContent="off";document.getElementById("cs").className="conn off";setTimeout(cws,2000)}
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==="profile"||m.type==="profile_update"){profile=m.profile;activeProfile=m.filename||activeProfile;activePage=profile.pages.find(p=>p.id===activePage)?activePage:(profile.pages[0]?.id||"");renderAll()}
  }
}

// ── Profile CRUD ──
async function lpl(){const r=await fetch("/api/profiles");profiles=(await r.json()).profiles||[];rpl()}
async function lp(fn){const r=await fetch("/api/profiles/"+fn);profile=await r.json();activeProfile=fn;activePage=profile.pages[0]?.id||"";selKey=null;renderAll()}
async function sp(){
  if(!profile)return;
  const r=await fetch("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(profile)});
  const d=await r.json();activeProfile=d.filename;dirty=false;
  if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"profile_saved",filename:d.filename}));
  lpl();t("Saved & synced")
}
async function dp(fn){if(!confirm("Delete "+fn+"?"))return;await fetch("/api/profiles/"+fn,{method:"DELETE"});if(activeProfile===fn){activeProfile="Default.json";await lp("Default.json")}lpl()}
async function cp(){
  const nm=document.getElementById("npn").value.trim();if(!nm)return;
  const p={profileName:nm,version:"1.0",defaultSound:"click",windowRules:[],pages:[{id:"main",label:"Main",columns:15,rows:15,keys:[]}]};
  const r=await fetch("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
  document.getElementById("npn").value="";lpl();lp((await r.json()).filename)
}
function np(){cp()}

// ── Pages ──
function apg(){const lb=document.getElementById("npl").value.trim();if(!lb)return;profile.pages.push({id:"p_"+Date.now(),label:lb,columns:15,rows:15,keys:[]});activePage=profile.pages[profile.pages.length-1].id;dirty=true;document.getElementById("npl").value="";renderAll()}
function dpg(pid){if(profile.pages.length<=1)return;profile.pages=profile.pages.filter(p=>p.id!==pid);if(activePage===pid)activePage=profile.pages[0].id;selKey=null;dirty=true;renderAll()}

// ── Render ──
function cp_(){return profile?.pages.find(p=>p.id===activePage)}
function renderAll(){rpl();rpgl();rg();rpr()}

function rpl(){
  document.getElementById("pl").innerHTML=profiles.map(p=>'<div class="it'+(p.filename===activeProfile?" ac":"")+'" onclick="lp(\''+p.filename+'\')">'+h(p.profileName)+'<span class="x" onclick="event.stopPropagation();dp(\''+p.filename+'\')">×</span></div>').join("")
}
function rpgl(){
  document.getElementById("pgl").innerHTML=profile?.pages.map(p=>'<div class="it'+(p.id===activePage?" ac":"")+'" onclick="activePage=\''+p.id+'\';selKey=null;renderAll()">'+h(p.label)+'<span class="x" onclick="event.stopPropagation();dpg(\''+p.id+'\')">×</span></div>').join("")||""
}

function rg(){
  const page=cp_(),grid=document.getElementById("eg");
  if(!page){grid.innerHTML="";return}
  const cols=page.columns||15,rows=page.rows||15;
  grid.style.gridTemplateColumns="repeat("+cols+", 1fr)";
  grid.style.gridTemplateRows="repeat("+rows+", minmax(28px,auto))";

  // Stepper displays
  document.getElementById("gcv").textContent=cols;
  document.getElementById("grv").textContent=rows;

  // Occupancy map
  const occ=Array.from({length:rows+1},()=>Array(cols+1).fill(null));
  (page.keys||[]).forEach(k=>{
    const c=k.col||1,r=k.row||1,w=k.w||1,h_=k.h||1;
    for(let rr=r;rr<r+h_&&rr<=rows;rr++)
      for(let cc=c;cc<c+w&&cc<=cols;cc++)
        occ[rr][cc]=k.id;
  });

  // Save occ for swap logic
  dragOcc=occ;

  // Render cells + keys
  let html="";
  // Empty cells with drop targets
  for(let r=1;r<=rows;r++){
    for(let c=1;c<=cols;c++){
      html+='<div class="gc" style="grid-column:'+c+';grid-row:'+r+'" '+
        'ondragover="event.preventDefault();event.dataTransfer.dropEffect=\'move\'" '+
        'ondrop="onDropCell(event,'+c+','+r+')" '+
        'onclick="addKey('+c+','+r+')"><span class="cl">'+c+','+r+'</span></div>';
    }
  }
  // Keys on top
  const done=new Set();
  for(let r=1;r<=rows;r++){
    for(let c=1;c<=cols;c++){
      const kid=occ[r][c];
      if(kid&&!done.has(kid)){
        done.add(kid);
        const k=page.keys.find(x=>x.id===kid);if(!k)continue;
        const kc=k.col||c,kr=k.row||r,kw=k.w||1,kh=k.h||1;
        const sel=k.id===selKey?" sel":"";
        html+='<div class="gk'+sel+'" data-kid="'+k.id+'" '+
          'style="background:'+(k.color||'var(--card)')+';grid-column:'+kc+'/span '+kw+';grid-row:'+kr+'/span '+kh+'" '+
          'draggable="true" ondragstart="onDS(event,\''+k.id+'\')" ondragend="onDE(event)" '+
          'ondragover="event.preventDefault();event.dataTransfer.dropEffect=\'move\'" '+
          'ondrop="onDropKey(event,\''+k.id+'\')" '+
          'onclick="event.stopPropagation();selKey=\''+k.id+'\';rg();rpr()">'+
          '<span class="kl">'+h(k.label)+'</span>'+
          (kw>1||kh>1?'<span class="sz">'+kw+'×'+kh+'</span>':'')+
          '<div class="rh" onmousedown="onRS(event,\''+k.id+'\')"></div>'+
          '</div>';
      }
    }
  }
  grid.innerHTML=html;
}

function addKey(c,r){
  const page=cp_();if(!page)return;
  const id="k_"+Date.now();
  page.keys.push({id,label:"?",action:"key",value:"A",color:"#0f3460",col:c,row:r,w:1,h:1,sound:""});
  selKey=id;dirty=true;rg();rpr()
}

// ── Drag & Drop ──
function onDS(e,kid){dragKey=kid;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",kid);setTimeout(()=>{const el=document.querySelector('[data-kid="'+kid+'"]');if(el)el.classList.add("drag")},0)}
function onDE(e){dragKey=null;document.querySelectorAll(".gk.drag").forEach(el=>el.classList.remove("drag"))}

function onDropCell(e,c,r){
  e.preventDefault();e.stopPropagation();
  if(!dragKey)return;
  const page=cp_();if(!page)return;
  const key=page.keys.find(k=>k.id===dragKey);
  if(key){key.col=c;key.row=r;dirty=true}
  dragKey=null;rg()
}
function onDropKey(e,targetId){
  e.preventDefault();e.stopPropagation();
  if(!dragKey||dragKey===targetId){dragKey=null;return}
  const page=cp_();if(!page)return;
  const a=page.keys.find(k=>k.id===dragKey);
  const b=page.keys.find(k=>k.id===targetId);
  if(a&&b){
    // Swap positions and sizes
    const ac=a.col||1,ar=a.row||1,aw=a.w||1,ah=a.h||1;
    a.col=b.col||1;a.row=b.row||1;a.w=b.w||1;a.h=b.h||1;
    b.col=ac;b.row=ar;b.w=aw;b.h=ah;
    dirty=true
  }
  dragKey=null;rg()
}

// ── Resize ──
function onRS(e,kid){
  e.preventDefault();e.stopPropagation();
  selKey=kid;rg();rpr();
  const el=document.querySelector('[data-kid="'+kid+'"]');
  if(!el)return;
  const page=cp_();if(!page)return;
  const cols=page.columns||15,rows=page.rows||15;
  const grid=document.getElementById("eg");
  const rect=grid.getBoundingClientRect();
  const cellW=rect.width/cols;
  const cellH=rect.height/rows;
  const startX=e.clientX,startY=e.clientY;
  const key=page.keys.find(k=>k.id===kid);if(!key)return;
  const startW=key.w||1,startH=key.h||1;

  function onMM(ev){
    const dw=Math.round((ev.clientX-startX)/cellW);
    const dh=Math.round((ev.clientY-startY)/cellH);
    const nw=Math.max(1,Math.min(cols-(key.col||1)+1,startW+dw));
    const nh=Math.max(1,Math.min(rows-(key.row||1)+1,startH+dh));
    if(nw!==key.w||nh!==key.h){key.w=nw;key.h=nh;dirty=true;rg();selKey=kid}
  }
  function onMU(){document.removeEventListener("mousemove",onMM);document.removeEventListener("mouseup",onMU);resizing=null}
  document.addEventListener("mousemove",onMM);
  document.addEventListener("mouseup",onMU);
  resizing={kid,onMM,onMU}
}

// ── Grid size steppers ──
function chgGrid(prop,d){
  const page=cp_();if(!page)return;
  const v=page[prop]||15;
  const nv=Math.max(2,Math.min(30,v+d));
  if(nv!==v){page[prop]=nv;dirty=true;rg()}
}

// ── Props panel ──
function rpr(){
  const panel=document.getElementById("pc"),page=cp_();
  const key=selKey?page?.keys.find(k=>k.id===selKey):null;
  // Update global sound selector
  const gs=document.getElementById("gs");
  if(gs&&profile)gs.value=profile.defaultSound||"none";

  if(!key){panel.innerHTML='<p style="font-size:11px;color:var(--dim)">Click a key to edit<br>or click empty cell to add</p>';return}
  const kw=key.w||1,kh=key.h||1;
  panel.innerHTML=
    '<label>Label</label><input value="'+h(key.label)+'" onchange="upk(\'label\',this.value)">'+
    '<label>Action</label><select onchange="upk(\'action\',this.value)">'+
      '<option value="key"'+(key.action==="key"?" selected":"")+'>Key Press</option>'+
      '<option value="text"'+(key.action==="text"?" selected":"")+'>Type Text</option></select>'+
    '<label>Value / Combo</label><input value="'+h(key.value||"")+'" onchange="upk(\'value\',this.value)">'+
    '<div class="hint">A, TAB, COMMAND+T, COMMAND+SHIFT+S</div>'+
    '<label>Color</label><input type="color" value="'+(key.color||"#0f3460")+'" onchange="upk(\'color\',this.value)">'+
    '<label>Sound <button onclick="testSnd(\''+(key.sound||"none")+'\')" style="font-size:9px;padding:1px 5px;margin-left:4px;cursor:pointer">▶</button></label>'+
    '<select onchange="upk(\'sound\',this.value)">'+
      '<option value=""'+(key.sound===""||!key.sound?" selected":"")+'>Inherit (global)</option>'+
      '<option value="none"'+(key.sound==="none"?" selected":"")+'>None</option>'+
      '<option value="click"'+(key.sound==="click"?" selected":"")+'>Click</option>'+
      '<option value="soft"'+(key.sound==="soft"?" selected":"")+'>Soft</option>'+
      '<option value="mechanical"'+(key.sound==="mechanical"?" selected":"")+'>Mechanical</option>'+
      '<option value="deep"'+(key.sound==="deep"?" selected":"")+'>Deep</option></select>'+
    '<div class="rw" style="margin-top:8px">'+
      '<div><label>Width</label><div class="stepper"><button onclick="upk(\'w\','+(kw-1)+')">−</button><span>'+kw+'</span><button onclick="upk(\'w\','+(kw+1)+')">+</button></div></div>'+
      '<div><label>Height</label><div class="stepper"><button onclick="upk(\'h\','+(kh-1)+')">−</button><span>'+kh+'</span><button onclick="upk(\'h\','+(kh+1)+')">+</button></div></div>'+
    '</div>'+
    '<div class="rw">'+
      '<div><label>Col</label><div class="stepper"><button onclick="upk(\'col\','+((key.col||1)-1)+')">−</button><span>'+(key.col||1)+'</span><button onclick="upk(\'col\','+((key.col||1)+1)+')">+</button></div></div>'+
      '<div><label>Row</label><div class="stepper"><button onclick="upk(\'row\','+((key.row||1)-1)+')">−</button><span>'+(key.row||1)+'</span><button onclick="upk(\'row\','+((key.row||1)+1)+')">+</button></div></div>'+
    '</div>'+
    '<div class="br"><button class="btn-del" onclick="dkey()">Delete Key</button></div>';
}

function upk(prop,val){
  const key=cp_()?.keys.find(k=>k.id===selKey);if(!key)return;
  if(prop==="w"||prop==="h"||prop==="col"||prop==="row")val=Math.max(1,parseInt(val)||1);
  key[prop]=val;dirty=true;rg();rpr()
}
function dkey(){if(!selKey||!confirm("Delete?"))return;const page=cp_();page.keys=page.keys.filter(k=>k.id!==selKey);selKey=null;dirty=true;renderAll()}

// ── Sound test ──
const SND={none:null,click:[800,0.06,"square",0.3],soft:[400,0.08,"sine",0.2],mechanical:[1200,0.04,"square",0.4],deep:[200,0.1,"triangle",0.5]};
let actx=null;
function testSnd(nm){
  if(!nm||nm==="none")return;const s=SND[nm];if(!s)return;
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=s[2];o.frequency.setValueAtTime(s[0],actx.currentTime);
    g.gain.setValueAtTime(s[3],actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+s[1]);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+s[1]);
  }catch(e){}
}

// ── Helpers ──
function h(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function t(msg,err){const el=document.getElementById("toast");el.textContent=msg;el.className="toast"+(err?" err":"");el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2000)}
function sts(msg){document.getElementById("st").textContent=msg;setTimeout(()=>document.getElementById("st").textContent="",3000)}

// ── Init ──
cws();lpl();lp("Default.json");
</script>
</body>
</html>
