<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Touch Panel — Editor</title>
<style>
:root{--bg:#1a1a2e;--panel:#16213e;--card:#0f3460;--accent:#e94560;--text:#eee;--dim:#888;--border:#2a2a4a;--green:#3a7ca5;--red:#8b3a3a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.tb{display:flex;align-items:center;gap:8px;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--border);height:38px;flex-shrink:0}
.tb h1{font-size:14px}.tb h1 span{color:var(--accent)}
.tb .conn{font-size:10px;padding:1px 6px;border-radius:3px}
.tb .conn.on{background:#4caf5040;color:#4caf50}.tb .conn.off{background:#f4433640;color:#f44336}
.tb select,.tb button{padding:3px 8px;border-radius:3px;border:1px solid var(--border);cursor:pointer;font-size:11px;background:var(--card);color:var(--text)}
.tb .btn-save{background:var(--green);color:#fff;border-color:var(--green)}
.tb .btn-new{background:#555;color:#fff}


.main{display:flex;flex:1;overflow:hidden}
.side{width:200px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto}
.side h3{font-size:10px;text-transform:uppercase;color:var(--dim);padding:8px 8px 2px;letter-spacing:1px}
.side .it,.rp .it{padding:4px 8px;cursor:pointer;font-size:11px;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center}
.side .it:hover{background:#ffffff08}.side .it.ac{border-left-color:var(--accent);color:var(--accent);background:#ffffff0c}
.side .it .x{visibility:hidden;color:var(--red);cursor:pointer;font-size:13px}.side .it:hover .x{visibility:visible}
.side .ar{display:flex;gap:3px;padding:3px 8px}
.side .ar input{flex:1;padding:2px 5px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:3px;font-size:10px}
.side .ar button{padding:2px 5px;font-size:10px;background:#555;color:#fff;border:none;border-radius:3px;cursor:pointer}
.carea{flex:1;position:relative;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.cwrap{transform-origin:center center}
.canvas{position:relative;border:2px solid var(--accent);box-shadow:0 0 20px rgba(233,69,96,0.3);background:rgba(0,0,0,0.15)}
.ck{position:absolute;background:var(--card);border:2px solid transparent;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;cursor:default;transition:border-color 0.1s;user-select:none;overflow:visible}
.ck:hover{border-color:rgba(255,255,255,0.4)}.ck.sel{border-color:var(--accent);box-shadow:0 0 8px rgba(233,69,96,0.5);cursor:default}

.ck .kl{pointer-events:none;text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ck .sz{position:absolute;top:1px;right:3px;font-size:8px;color:rgba(255,255,255,0.4);pointer-events:none}
.ck .rh{position:absolute;bottom:-4px;right:-4px;width:28px;height:28px;cursor:se-resize;opacity:0;pointer-events:none;background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,0.4) 50%);border-radius:0 0 4px 0;z-index:2}
.ck:hover .rh,.ck.sel .rh{opacity:1;pointer-events:auto!important}
.gh{position:absolute;border:1px dashed rgba(255,255,255,0.3);background:rgba(255,255,255,0.05);pointer-events:none;z-index:2;display:none}.gt{position:absolute;color:rgba(255,255,255,0.5);font-size:10px;pointer-events:none;z-index:2;display:none;white-space:nowrap}.sr{position:absolute;border:1px solid var(--accent);background:rgba(233,69,96,0.15);z-index:5;pointer-events:none;display:none}.grh{position:absolute;width:10px;height:10px;background:var(--accent);border-radius:2px;z-index:6;cursor:pointer;display:none}.grbox{position:absolute;border:2px dashed rgba(233,69,96,0.6);border-radius:2px;z-index:4;pointer-events:none;display:none}
.rp{width:260px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:0}.rp-section{padding:10px}.rp-divider{height:1px;background:var(--border);margin:0 10px}
.rp h3{font-size:12px;margin-bottom:8px}.rp label{display:block;font-size:10px;color:var(--dim);margin:6px 0 2px}
.rp input,.rp select{width:100%;padding:4px 6px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:3px;font-size:11px}
.rp input[type=color]{height:26px;padding:1px}.rp input[type=number]::-webkit-outer-spin-button,.rp input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.rp input[type=number]{-moz-appearance:textfield}.rp .rw{display:flex;gap:4px}.rp .rw>div{flex:1}
.rp .stepper{display:flex;align-items:center;gap:2px}
.rp .stepper button{width:24px;height:24px;font-size:14px;line-height:1;text-align:center;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:3px;cursor:pointer}
.rp .stepper span{width:24px;text-align:center;font-size:13px;font-weight:600}
.rp .hint{font-size:9px;color:var(--dim);margin-top:1px}.rp .br{display:flex;gap:4px;margin-top:8px}
.rp .br button{flex:1;padding:5px;font-size:11px;cursor:pointer;border-radius:3px}.rp .btn-del{background:var(--red);color:#fff;border:none}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:6px 16px;border-radius:5px;font-size:12px;z-index:999;opacity:0;transition:opacity 0.3s}.toast.show{opacity:1}
.ftb{position:absolute;display:flex;align-items:center;gap:4px;height:20px;z-index:10;pointer-events:none}.ftb>*{pointer-events:auto}.ftb select{background:rgba(15,52,96,0.85);color:#eee;border:1px solid var(--accent);border-radius:2px;padding:0 4px;font-size:9px;cursor:pointer}.ftb .btn-ori{background:rgba(15,52,96,0.85);color:#eee;border:1px solid var(--accent);border-radius:2px;padding:0 5px;font-size:9px;cursor:pointer;white-space:nowrap}

.info{position:fixed;bottom:4px;left:4px;color:#fff;font-size:10px;z-index:999;background:rgba(0,0,0,0.85);padding:5px 8px;border-radius:4px;user-select:text;-webkit-user-select:text;max-width:95vw}
@font-face{font-family:"Press Start 2P";src:url("/static/fonts/PressStart2P.woff2") format("woff2")}
@font-face{font-family:"VT323";src:url("/static/fonts/VT323.woff2") format("woff2")}
@font-face{font-family:"Russo One";src:url("/static/fonts/RussoOne.woff2") format("woff2")}
</style></head>
<body>
<div class="tb">
  <h1>Smart <span>Touch</span> Editor</h1>
  <span class="conn off" id="cs">off</span>
  <select id="gs" onchange="if(profile){profile.defaultSound=this.value;dirty=true}" style="font-size:10px">
    <option value="none">None</option><option value="click">Click</option><option value="soft">Soft</option>
    <option value="mechanical">Mechanical</option><option value="deep">Deep</option>
  </select>
  <button class="btn-save" onclick="saveProfile()">Save & Sync</button>
  <button class="btn-new" onclick="resetDefault()">Reset Default</button>
  <button class="btn-new" onclick="saveAs()">Save As</button>
  <button onclick="undo()" title="Undo (Ctrl+Z)">↩</button>
  <button onclick="redo()" title="Redo (Ctrl+Shift+Z)">↪</button>
</div>
<div class="main">
<div class="side">
  <h3>Profiles</h3><div id="pl"></div>
  <div class="ar"><input id="npn" placeholder="Name"><button onclick="cp()">+</button></div>
  <h3>Pages</h3><div id="pgl"></div>
  <div class="ar"><input id="npl" placeholder="Label"><button onclick="apg()">+</button></div>
  <h3>Zoom</h3>
  <div class="stepper" style="padding:4px 8px"><button onclick="zoomBy(-1)">−</button><span id="zv">60</span><button onclick="zoomBy(1)">+</button></div>
</div>
<div class="carea" id="carea">
  <div class="gh" id="gh"></div><div id="gtip" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:11px;pointer-events:none;z-index:100;display:none">Double-click empty area to add key</div>
  <div class="ftb" id="ftb"><select id="fdev" onchange="onFDev()"><option value="iPad 11&quot;">iPad 11"</option><option value="iPad 4:3">iPad 4:3</option><option value="iPad mini">iPad mini</option><option value="Android 16:10">Android 16:10</option></select><button class="btn-ori" onclick="toggleOri()" title="Toggle landscape/portrait">&#x21C4;</button></div>
  <div class="sr" id="sr"></div><div class="grh" id="grh_b" style="cursor:s-resize"></div><div class="grh" id="grh_l" style="cursor:w-resize"></div><div class="grh" id="grh_r" style="cursor:e-resize"></div>
  <div class="cwrap" id="cwrap"><div class="canvas" id="canvas"></div></div>
</div>
<div class="rp">
  <div class="rp-section">
    <h3>Groups <button onclick="saveAsGroup()" style="font-size:10px;padding:2px 8px;background:rgba(233,161,69,0.2);color:#e9a145;border:1px solid #e9a145;border-radius:3px;cursor:pointer">+ New Group</button></h3>
    <div id="grpl"><p style="font-size:10px;color:var(--dim);padding:8px 0">Select keys, then click + New Group</p></div>
  </div>
  <div class="rp-divider"></div>
  <div class="rp-section">
    <h3>Key Properties</h3>
    <div id="pc"><p style="font-size:11px;color:var(--dim)">Click a key to edit</p></div>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>
<div class="info" id="edinfo"></div>
<script>
"use strict";
function hesc(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
let ws=null,profile=null,profiles=[],activePage="",activeProfile="Default.json";
let selKey=null,selKeys=new Set(),selGroup=null,dirty=false;
let panX=0,panY=0,panning=false,panStartX=0,panStartY=0,mx=0,my=0;
let selecting=false,srSX=0,srSY=0,srCX=0,srCY=0;
let undoStack=[],redoStack=[];
const MAX_UNDO=200;
const DEVS={"iPad 4:3":{w:1024,h:1366},"iPad 11\"":{w:834,h:1210},"iPad mini":{w:744,h:1133},"Android 16:10":{w:1280,h:800}};

// ── Undo/Redo ──
function _snapshot(k){return{id:k.id,col:k.col,row:k.row,w:k.w,h:k.h,label:k.label,action:k.action,value:k.value,color:k.color,sound:k.sound,groupId:k.groupId}}
function _pushUndo(keysBefore){
  const page=cp_();if(!page)return;
  const after=keysBefore.map(b=>{const k=page.keys.find(x=>x.id===b.id);return k?_snapshot(k):null}).filter(Boolean);
  undoStack.push({before:keysBefore.map(b=>({...b})),after,ts:Date.now()});
  if(undoStack.length>MAX_UNDO)undoStack.shift();
  redoStack=[];
}
function undo(){
  if(!undoStack.length)return;
  const e=undoStack.pop();
  const page=cp_();if(!page)return;
  e.before.forEach(b=>{const k=page.keys.find(x=>x.id===b.id);if(k){Object.assign(k,b)}else{page.keys.push({...b})}});
  const bid=new Set(e.before.map(b=>b.id));
  const toDel=page.keys.filter(k=>!bid.has(k.id)&&e.after.some(a=>a.id===k.id));
  toDel.forEach(k=>{page.keys=page.keys.filter(x=>x.id!==k.id)});
  redoStack.push(e);dirty=true;
  selKey=e.before.length===1?e.before[0].id:null;selKeys.clear();e.before.forEach(b=>selKeys.add(b.id));
  rr();rpr();
}
function redo(){
  if(!redoStack.length)return;
  const e=redoStack.pop();
  const page=cp_();if(!page)return;
  e.after.forEach(a=>{const k=page.keys.find(x=>x.id===a.id);if(k){Object.assign(k,a)}else{page.keys.push({...a})}});
  const aid=new Set(e.after.map(a=>a.id));
  const toDel=page.keys.filter(k=>!aid.has(k.id)&&e.before.some(b=>b.id===k.id));
  toDel.forEach(k=>{page.keys=page.keys.filter(x=>x.id!==k.id)});
  undoStack.push(e);dirty=true;
  selKey=e.after.length===1?e.after[0].id:null;selKeys.clear();e.after.forEach(a=>selKeys.add(a.id));
  rr();rpr();
}

// ── Group/Ungroup ──
function groupSelected(){
  if(selKeys.size<2)return;
  const page=cp_();if(!page)return;
  const before=page.keys.filter(k=>selKeys.has(k.id)).map(k=>_snapshot(k));
  const gid="g_"+Date.now();
  if(!profile.groups)profile.groups=[];
  profile.groups.push({id:gid,name:"Group "+(profile.groups.length+1)});
  page.keys.forEach(k=>{if(selKeys.has(k.id))k.groupId=gid});
  _pushUndo(before);dirty=true;rr();rpr();
}
function rgrp(){const groups=profile?.groups||[];document.getElementById("grpl").innerHTML=groups.length?groups.map(g=>"<div class=\"it\" onclick=\"selectGroup('"+g.id+"')\">"+hesc(g.name)+"<span class=\"x\" onclick=\"event.stopPropagation();ungroupById('"+g.id+"')\">✕</span></div>").join(""):"<p style=\"font-size:10px;color:var(--dim)\">Select keys → Save as Group</p>";}function saveAsGroup(){const name=prompt("Group name:","Group "+((profile.groups?.length||0)+1));if(!name||!name.trim())return;const gid="g_"+Date.now();if(!profile.groups)profile.groups=[];profile.groups.push({id:gid,name:name.trim()});const before=cp_().keys.filter(k=>selKeys.has(k.id)).map(k=>_snapshot(k));cp_().keys.forEach(k=>{if(selKeys.has(k.id))k.groupId=gid});_pushUndo(before);dirty=true;renderAll();}
function selectGroup(gid){selGroup=gid;selKeys.clear();selKey=null;cp_().keys.forEach(k=>{if(k.groupId===gid)selKeys.add(k.id)});rr();rpr();rgrp();}
let mT=[],mM=1,mTK=null;function openMM(kid){mTK=kid;mT=[];var k=cp_()?.keys.find(function(x){return x.id===kid});var lbl=document.getElementById("mkl");if(lbl)lbl.textContent="Assigning: "+(k?k.label:kid)+(k&&k.value?" (current: "+k.value+")":"");setMM(1);renderMT();document.getElementById("macroModal").style.display="flex";document.getElementById("mtc").focus()}function closeMM(){document.getElementById("macroModal").style.display="none";mT=[];mTK=null}function setMM(m){mM=m;document.getElementById("mcb").style.background=m===1?"var(--accent)":"var(--card)";document.getElementById("msq").style.background=m===2?"var(--accent)":"var(--card)";document.getElementById("mcb").style.color=m===1?"#fff":"var(--text)";document.getElementById("msq").style.color=m===2?"#fff":"var(--text)"}function addMT(key){mT.push(key);renderMT()}function renderMT(){document.getElementById("mtc").innerHTML=(mT.length===0?"<span style=color:var(--dim);font-size:11px>Click here and type keys, or click modifiers...</span>":"")+mT.map(function(k,i){return"<span data-mi="+i+" style=background:var(--card);padding:3px 8px;border-radius:3px;font-size:12px;display:inline-flex;align-items:center;gap:4px>"+k+"<span onclick=removeMT("+i+") style=cursor:pointer;color:var(--red);margin-left:4px>x</span></span>"}).join("")}function removeMT(i){mT.splice(i,1);renderMT()}function saveMacro(){var s=mM===1?"+":",";var v=mT.join(s);var k=cp_()?.keys.find(function(x){return x.id===mTK});if(k){var b=_snapshot(k);k.value=v;k.action="macro";if(JSON.stringify(b)!==JSON.stringify(_snapshot(k)))_pushUndo([b])}closeMM();dirty=true;rr();rpr()}document.addEventListener("keydown",function(e){var mm=document.getElementById("macroModal");if(!mm||mm.style.display!=="flex")return;if(["Shift","Control","Alt","Meta","Escape"].includes(e.key))return;e.preventDefault();e.stopPropagation();var KM={Enter:"ENTER",Tab:"TAB"," ":"SPACE",Backspace:"DELETE",ArrowUp:"UP",ArrowDown:"DOWN",ArrowLeft:"LEFT",ArrowRight:"RIGHT"};addMT(KM[e.key]||e.key.toUpperCase())},{capture:true});function ungroupById(gid){if(!confirm("Ungroup?"))return;const before=cp_().keys.filter(k=>k.groupId===gid).map(k=>_snapshot(k));cp_().keys.forEach(k=>{if(k.groupId===gid)k.groupId=null});profile.groups=profile.groups.filter(g=>g.id!==gid);_pushUndo(before);selKeys.clear();selKey=null;selGroup=null;dirty=true;renderAll();}
function ungroupSelected(){
  const page=cp_();if(!page)return;
  const gids=new Set();selKeys.forEach(id=>{const k=page.keys.find(x=>x.id===id);if(k&&k.groupId)gids.add(k.groupId)});
  if(!gids.size)return;
  const before=page.keys.filter(k=>k.groupId&&gids.has(k.groupId)).map(k=>_snapshot(k));
  page.keys.forEach(k=>{if(gids.has(k.groupId))k.groupId=null});
  if(profile.groups)profile.groups=profile.groups.filter(g=>!gids.has(g.id));
  _pushUndo(before);dirty=true;rr();rpr();
}

// ── Keyboard shortcuts ──
document.addEventListener("keydown",e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key==="z"){e.preventDefault();if(e.shiftKey)redo();else undo()}
  if(mod&&e.key==="g"){e.preventDefault();if(e.shiftKey)ungroupSelected();else groupSelected()}
});

async function resetDefault(){
  if(!confirm("Reset to default 89-key keyboard? Current layout will be lost."))return;
  try{const r=await fetch("/api/default-template");profile=await r.json();profile.profileName="Default";activePage=profile.pages[0]?.id||"";panX=0;panY=0;selKey=null;selKeys.clear();dirty=true;renderAll();t("Default layout loaded")}catch(e){t("Failed: "+e,true)}
}
function cws(){
  ws=new WebSocket("ws://"+location.hostname+":8082/ws");
  ws.onopen=()=>{document.getElementById("cs").textContent="connected";document.getElementById("cs").className="conn on"};
  ws.onclose=()=>{document.getElementById("cs").textContent="off";document.getElementById("cs").className="conn off";setTimeout(cws,2000)};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="profile"||m.type==="profile_update"){profile=m.profile;activeProfile=m.filename||activeProfile;activePage=profile.pages.find(p=>p.id===activePage)?activePage:(profile.pages[0]?.id||"");panX=profile.canvasX||0;panY=profile.canvasY||0;selKey=null;selKeys.clear();undoStack=[];redoStack=[];renderAll()}};
}

async function lpl(){const r=await fetch("/api/profiles");profiles=(await r.json()).profiles||[];rpl()}
async function lp(fn){const r=await fetch("/api/profiles/"+fn);profile=await r.json();activeProfile=fn;activePage=profile.pages[0]?.id||"";selKey=null;selKeys.clear();panX=profile.canvasX||0;panY=profile.canvasY||0;renderAll()}
async function saveProfile(){
  if(!profile)return;
  profile.canvasX=panX;profile.canvasY=panY;
  const r=await fetch("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(profile)});
  const d=await r.json();activeProfile=d.filename;dirty=false;
  if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"profile_saved",filename:d.filename}));
  lpl();t("Saved & synced");
}
async function dp(fn){if(!confirm("Delete "+fn+"?"))return;await fetch("/api/profiles/"+fn,{method:"DELETE"});if(activeProfile===fn){activeProfile="Default.json";await lp("Default.json")}lpl()}
async function saveAs(){const nm=prompt("Save as profile name:",profile?profile.profileName:"");if(!nm)return;profile.profileName=nm;profile.canvasX=panX;profile.canvasY=panY;const r=await fetch("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(profile)});const d=await r.json();activeProfile=d.filename;dirty=false;lpl();t("Saved as "+d.filename)}
async function saveAs(){const nm=prompt("Save as profile name:",profile?profile.profileName:"");if(!nm)return;profile.profileName=nm;profile.canvasX=panX;profile.canvasY=panY;const r=await fetch("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(profile)});const d=await r.json();activeProfile=d.filename;dirty=false;lpl();t("Saved as "+d.filename)}
async function cp(){const p={profileName:"Untitled",version:"1.0",device:"iPad 11\"",deviceWidth:834,deviceHeight:1210,cellSize:60,gap:0,canvasX:0,canvasY:0,defaultSound:"click",windowRules:[],pages:[{id:"main",label:"Main",keys:[]}],groups:[]};const r=await fetch("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});lpl();lp((await r.json()).filename)}
function apg(){const lb=document.getElementById("npl").value.trim();if(!lb)return;profile.pages.push({id:"p_"+Date.now(),label:lb,keys:[]});activePage=profile.pages[profile.pages.length-1].id;dirty=true;document.getElementById("npl").value="";renderAll()}
async function renameProfile(fn){const nm=prompt("Rename profile:",fn.replace(".json",""));if(!nm||!nm.trim())return;const r=await fetch("/api/profiles/"+encodeURIComponent(fn)+"/rename",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({newName:nm.trim()})});if(r.ok){const d=await r.json();if(activeProfile===fn)activeProfile=d.filename;lpl();t("Renamed to "+d.filename)}}
async function copyProfile(fn){const r=await fetch("/api/profiles/"+fn);const p=await r.json();p.profileName=(p.profileName||fn.replace(".json",""))+" (Copy)";const r2=await fetch("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});lpl();t("Copied: "+p.profileName)}
function dpg(pid){if(profile.pages.length<=1)return;profile.pages=profile.pages.filter(p=>p.id!==pid);if(activePage===pid)activePage=profile.pages[0].id;selKey=null;selKeys.clear();dirty=true;renderAll()}
function cp_(){return profile?.pages.find(p=>p.id===activePage)}
function renderAll(){rpl();rpgl();rr();rpr();rgrp()}
function rpl(){document.getElementById("pl").innerHTML=profiles.map(p=>'<div class="it'+(p.filename===activeProfile?" ac":"")+'" onclick="lp(\''+p.filename+'\')">'+hesc(p.profileName)+'<span class="x" onclick="event.stopPropagation();dp(\''+p.filename+'\')">×</span></div>').join("")}
function rpgl(){document.getElementById("pgl").innerHTML=profile?.pages.map(p=>'<div class="it'+(p.id===activePage?" ac":"")+'" onclick="activePage=\''+p.id+'\';selKey=null;selKeys.clear();selGroup=null;renderAll()">'+hesc(p.label)+'<span class="x" onclick="event.stopPropagation();dpg(\''+p.id+'\')">×</span></div>').join("")||""}

// Group resize functions
function grResizeStart(e,corner){
  e.preventDefault();e.stopPropagation();
  var page=cp_();if(!page)return;
  var cs2=profile.cellSize||60,gp2=profile.gap||0,cpx2=cs2+gp2;
  var ca2=document.getElementById("carea"),cw2=ca2.clientWidth,ch2=ca2.clientHeight;
  var dw2=profile.deviceWidth||834,dh2=profile.deviceHeight||1210;
  var scale2=Math.min(cw2*0.85/dw2,ch2*0.85/dh2);
  var startX=e.clientX,startY=e.clientY;
  var orig=page.keys.filter(function(k){return selKeys.has(k.id)}).map(function(k){var s=_snapshot(k);s.col=s.col||0;s.row=s.row||0;s.w=s.w||1;s.h=s.h||1;return s});
  var oMinX=Infinity,oMinY=Infinity,oMaxX=-Infinity,oMaxY=-Infinity;
  orig.forEach(function(k){
    if(k.col<oMinX)oMinX=k.col;if(k.row<oMinY)oMinY=k.row;
    if(k.col+k.w>oMaxX)oMaxX=k.col+k.w;if(k.row+k.h>oMaxY)oMaxY=k.row+k.h;
  });
  var oW=oMaxX-oMinX,oH=oMaxY-oMinY;
  function mm(ev){
    var dx=(ev.clientX-startX)/(cpx2*scale2),dy=(ev.clientY-startY)/(cpx2*scale2);
    var sX=1,sY=1,aX=0,aY=0;
    if(corner==="grh_tl"){aX=oMaxX;aY=oMaxY;sX=Math.max(0.1,(oW-dx)/oW);sY=Math.max(0.1,(oH-dy)/oH)}
    else if(corner==="grh_tr"){aX=oMinX;aY=oMaxY;sX=Math.max(0.1,(oW+dx)/oW);sY=Math.max(0.1,(oH-dy)/oH)}
    else if(corner==="grh_bl"){aX=oMaxX;aY=oMinY;sX=Math.max(0.1,(oW-dx)/oW);sY=Math.max(0.1,(oH+dy)/oH)}
    else{aX=oMinX;aY=oMinY;sX=Math.max(0.1,(oW+dx)/oW);sY=Math.max(0.1,(oH+dy)/oH)}
    page.keys.forEach(function(k){
      if(!selKeys.has(k.id))return;
      var o=orig.find(function(x){return x.id===k.id});if(!o)return;
      if(corner==="grh_tl"){k.col=_snap4(aX-(aX-o.col)*sX);k.row=_snap4(aY-(aY-o.row)*sY)}
      else if(corner==="grh_tr"){k.col=_snap4(aX+(o.col-aX)*sX);k.row=_snap4(aY-(aY-o.row)*sY)}
      else if(corner==="grh_bl"){k.col=_snap4(aX-(aX-o.col)*sX);k.row=_snap4(aY+(o.row-aY)*sY)}
      else{k.col=_snap4(aX+(o.col-aX)*sX);k.row=_snap4(aY+(o.row-aY)*sY)}
      k.w=_snap4(Math.max(0.25,o.w*sX));k.h=_snap4(Math.max(0.25,o.h*sY));
    });
    dirty=true;rr();
  }
  function mu(){
    document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);
    var now=page.keys.filter(function(k){return selKeys.has(k.id)}).map(function(k){return _snapshot(k)});
    if(JSON.stringify(orig)!==JSON.stringify(now))_pushUndo(orig);
  }
  document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);
}

  document.getElementById("edinfo").textContent=`sel=${selKeys.size} cw=${cw}x${ch} dw=${dw}x${dh} cs=${cs} gap=${gp} s=${scale.toFixed(3)} pan=(${panX.toFixed(1)},${panY.toFixed(1)})`;
}

rr();rpr();
  const k=cp_()?.keys.find(x=>x.id===kid);if(!k)return;
  const cs=profile.cellSize||60,gp=profile.gap||0,cpx=cs+gp;
  const ca=document.getElementById("carea"),cw=ca.clientWidth,ch=ca.clientHeight;

  const before=cp_()?.keys.filter(kk=>selKeys.has(kk.id)).map(kk=>_snapshot(kk))||[];

    let anyMoved=false;
    const newPos=moved.map(m=>{const nc=_snap4(m.scol+dx),nr=_snap4(m.srow+dy);return{...m,nc,nr}});
    const ok=newPos.every(m=>!cp_()?.keys.some(ok=>ok.id!==m.id&&!selKeys.has(ok.id)&&_overlap({col:m.nc,row:m.nr,w:cp_()?.keys.find(x=>x.id===m.id)?.w||1,h:cp_()?.keys.find(x=>x.id===m.id)?.h||1},{col:ok.col||0,row:ok.row||0,w:ok.w||1,h:ok.h||1})));
    if(ok){newPos.forEach(m=>{const kk=cp_()?.keys.find(x=>x.id===m.id);if(kk&&(kk.col!==m.nc||kk.row!==m.nr)){kk.col=m.nc;kk.row=m.nr;anyMoved=true}});if(anyMoved){dirty=true;rr();selKey=kid}}
  }

    if(!undoStack.length||JSON.stringify(undoStack[undoStack.length-1].before)!==JSON.stringify(now)){if(JSON.stringify(before)!==JSON.stringify(now)){_pushUndo(before)}}
    if(selKeys.size===1){

      if(tk&&tk.dataset.kid!==kid){

        if(a&&b){const sb=[_snapshot(a),_snapshot(b)];const ac=a.col,ar=a.row,aw=a.w,ah=a.h;a.col=b.col;a.row=b.row;a.w=b.w;a.h=b.h;b.col=ac;b.row=ar;b.w=aw;b.h=ah;_pushUndo(sb);dirty=true;rr();selKey=kid}
      }
    }
  }
  document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);
}

// Key resize: 0.25 snap, collision, Shift=left resize
function onRS(e,kid){
  e.preventDefault();e.stopPropagation();selKey=kid;selKeys.clear();selKeys.add(kid);rr();rpr();
  const k=cp_()?.keys.find(x=>x.id===kid);if(!k)return;
  const cs=profile.cellSize||60,gp=profile.gap||0,cpx=cs+gp;
  const ca=document.getElementById("carea"),cw=ca.clientWidth,ch=ca.clientHeight;
  const dw=profile.deviceWidth||834,dh=profile.deviceHeight||1210;
  const scale=Math.min(cw*0.85/dw,ch*0.85/dh);
  const startX=e.clientX,startY=e.clientY,startW=k.w||1,startH=k.h||1,startCol=k.col||0;
  const before=_snapshot(k);
  function mm(ev){
    const dw_=_snap4((ev.clientX-startX)/(cpx*scale)),dh_=_snap4((ev.clientY-startY)/(cpx*scale));
    const nw=Math.max(0.25,_snap4(startW+dw_)),nh=Math.max(0.25,_snap4(startH+dh_));
    const ncol=ev.shiftKey?_snap4(startCol-dw_):startCol;
    if(!_collides(kid,ncol,k.row||0,nw,nh)&&(nw!==k.w||nh!==k.h||ncol!==k.col)){k.col=ncol;k.w=nw;k.h=nh;dirty=true;rr();selKey=kid}
  }
  function mu(){document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);if(JSON.stringify(before)!==JSON.stringify(_snapshot(k))){_pushUndo([before])}}
  document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);
}

// ── Document mousemove: selection rect or pan ──

  if(selecting){

    const mc=Math.min(c1.col,c2.col),Mc=Math.max(c1.col,c2.col),mr=Math.min(c1.row,c2.row),Mr=Math.max(c1.row,c2.row);
    selKeys.clear();
    cp_()?.keys.forEach(k=>{const col=k.col||0,row=k.row||0,w=k.w||1,h=k.h||1;if(col+w>mc&&col<Mc&&row+h>mr&&row<Mr)selKeys.add(k.id)});

  const dw=profile.deviceWidth||834,dh=profile.deviceHeight||1210,cs=profile.cellSize||60,gp=profile.gap||0;

  const scale=Math.min(cw*0.85/dw,ch*0.85/dh);

function upk(prop,val){const key=cp_()?.keys.find(k=>k.id===selKey);if(!key)return;const before=_snapshot(key);if(prop==="w"||prop==="h")val=Math.max(0.25,_snap4(parseFloat(val)||1));key[prop]=val;dirty=true;if(JSON.stringify(before)!==JSON.stringify(_snapshot(key))){_pushUndo([before])}rr();rpr()}
function upkGroupStepSzVal(val){var page=cp_();if(!page)return;val=Math.max(6,Math.min(48,Math.round(val)));var before=page.keys.filter(function(k){return selKeys.has(k.id)}).map(function(k){return _snapshot(k)});selKeys.forEach(function(kid){var k=page.keys.find(function(x){return x.id===kid});if(k)k.fontSize=val});_pushUndo(before);dirty=true;rr();rpr();}
function upkGroupStepSz(delta){var page=cp_();if(!page)return;var before=page.keys.filter(function(k){return selKeys.has(k.id)}).map(function(k){return _snapshot(k)});selKeys.forEach(function(kid){var k=page.keys.find(function(x){return x.id===kid});if(k){var cur=k.fontSize||Math.max(8,(profile?.cellSize||60)*0.25);k.fontSize=Math.max(6,Math.min(48,Math.round(cur+delta)))}});_pushUndo(before);dirty=true;rr();rpr();}
function upkGroupStep(prop,delta){
  var page=cp_();if(!page)return;
  var before=page.keys.filter(function(k){return selKeys.has(k.id)}).map(function(k){return _snapshot(k)});
  var isW=prop==="w";
  // Add delta
  page.keys.forEach(function(k){
    if(!selKeys.has(k.id))return;
    var o=before.find(function(x){return x.id===k.id});if(!o)return;
    if(isW){k.w=_snap4(Math.max(0.25,o.w+delta))}else{k.h=_snap4(Math.max(0.25,o.h+delta))}
  });
  // Group by perpendicular overlap (not exact equality)
  var used={};var groups=[];
  before.forEach(function(o){
    if(used[o.id])return;
    var grp=[o];used[o.id]=true;
    var changed=true;
    while(changed){ // expand group: include all keys that overlap any key in group
      changed=false;
      before.forEach(function(p){
        if(used[p.id])return;
        for(var gi=0;gi<grp.length;gi++){
          var g=grp[gi];
          var overlap=isW?!(g.row+g.h<=p.row||p.row+p.h<=g.row):!(g.col+g.w<=p.col||p.col+p.w<=g.col);
          if(overlap){grp.push(p);used[p.id]=true;changed=true;break}
        }
      });
    }
    groups.push(grp);
  });
  // Within each group, sort and shift
  for(var g=0;g<groups.length;g++){
    var arr=groups[g].sort(function(a,b){return isW?(a.col-b.col):(a.row-b.row)});
    for(var i=0;i<arr.length;i++){
      var k=page.keys.find(function(x){return x.id===arr[i].id});if(!k)continue;
      if(isW){k.col=arr[i].col}else{k.row=arr[i].row}
      if(i===0)continue;
      var prevO=arr[i-1],prevK=page.keys.find(function(x){return x.id===prevO.id});
      var prevEdge=isW?(prevK.col+prevK.w):(prevK.row+prevK.h);
      var origEdge=isW?(prevO.col+prevO.w):(prevO.row+prevO.h);
      var origStart=isW?arr[i].col:arr[i].row;
      var g2=origStart-origEdge;
      if(g2>=0){if(isW){k.col=_snap4(prevEdge+g2)}else{k.row=_snap4(prevEdge+g2)}}
    }
  }
  _pushUndo(before);dirty=true;rr();rpr();
}

document.addEventListener("keydown",e=>{

  if(e.metaKey)combo+="COMMAND+";
  if(e.ctrlKey)combo+="CONTROL+";
  if(e.altKey)combo+="OPTION+";
  if(e.shiftKey&&e.key.length>1)combo+="SHIFT+";
  const KM={Enter:"ENTER",Escape:"ESCAPE",Tab:"TAB",Backspace:"DELETE"," ":"SPACE",ArrowUp:"UP",ArrowDown:"DOWN",ArrowLeft:"LEFT",ArrowRight:"RIGHT"};
  combo+=KM[e.key]||e.key.toUpperCase();
