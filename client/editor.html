<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Touch Panel — Editor</title>
<style>
:root{--bg:#1a1a2e;--panel:#16213e;--card:#0f3460;--accent:#e94560;--text:#eee;--dim:#888;--border:#2a2a4a;--green:#3a7ca5;--red:#8b3a3a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.tb{display:flex;align-items:center;gap:8px;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--border);height:38px;flex-shrink:0}
.tb h1{font-size:14px}.tb h1 span{color:var(--accent)}
.tb .conn{font-size:10px;padding:1px 6px;border-radius:3px}
.tb .conn.on{background:#4caf5040;color:#4caf50}.tb .conn.off{background:#f4433640;color:#f44336}
.tb select,.tb button{padding:3px 8px;border-radius:3px;border:1px solid var(--border);cursor:pointer;font-size:11px;background:var(--card);color:var(--text)}
.tb .btn-save{background:var(--green);color:#fff;border-color:var(--green)}
.tb .btn-new{background:#555;color:#fff}
.main{display:flex;flex:1;overflow:hidden}
.side{width:200px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto}
.side h3{font-size:10px;text-transform:uppercase;color:var(--dim);padding:8px 8px 2px;letter-spacing:1px}
.side .it{padding:4px 8px;cursor:pointer;font-size:11px;border-left:3px solid transparent;display:flex;justify-content:space-between}
.side .it:hover{background:#ffffff08}.side .it.ac{border-left-color:var(--accent);color:var(--accent);background:#ffffff0c}
.side .it .x{visibility:hidden;color:var(--red);cursor:pointer;font-size:13px}.side .it:hover .x{visibility:visible}
.side .ar{display:flex;gap:3px;padding:3px 8px}
.side .ar input{flex:1;padding:2px 5px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:3px;font-size:10px}
.side .ar button{padding:2px 5px;font-size:10px;background:#555;color:#fff;border:none;border-radius:3px;cursor:pointer}
.carea{flex:1;position:relative;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
/* Fixed-size canvas wrapper — same approach as iPad */
.cwrap{transform-origin:center center}
.canvas{position:relative;border:2px solid var(--accent);box-shadow:0 0 20px rgba(233,69,96,0.3);background:rgba(0,0,0,0.15)}
.ck{position:absolute;background:var(--card);border:2px solid transparent;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;cursor:grab;transition:border-color 0.1s;user-select:none;overflow:hidden}
.ck:hover{border-color:rgba(255,255,255,0.4)}.ck.sel{border-color:var(--accent);box-shadow:0 0 8px rgba(233,69,96,0.5);cursor:default}
.ck .kl{pointer-events:none;text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ck .sz{position:absolute;top:1px;right:3px;font-size:8px;color:rgba(255,255,255,0.4);pointer-events:none}
.ck .rh{position:absolute;bottom:0;right:0;width:12px;height:12px;cursor:se-resize;opacity:0;background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,0.4) 50%);border-radius:0 0 4px 0}
.ck:hover .rh,.ck.sel .rh{opacity:1}
.rp{width:260px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:10px}
.rp h3{font-size:12px;margin-bottom:8px}.rp label{display:block;font-size:10px;color:var(--dim);margin:6px 0 2px}
.rp input,.rp select{width:100%;padding:4px 6px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:3px;font-size:11px}
.rp input[type=color]{height:26px;padding:1px}.rp .rw{display:flex;gap:4px}.rp .rw>div{flex:1}
.rp .stepper{display:flex;align-items:center;gap:2px}
.rp .stepper button{width:24px;height:24px;font-size:14px;line-height:1;text-align:center;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:3px;cursor:pointer}
.rp .stepper span{width:24px;text-align:center;font-size:13px;font-weight:600}
.rp .hint{font-size:9px;color:var(--dim);margin-top:1px}.rp .br{display:flex;gap:4px;margin-top:8px}
.rp .br button{flex:1;padding:5px;font-size:11px;cursor:pointer;border-radius:3px}.rp .btn-del{background:var(--red);color:#fff;border:none}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:6px 16px;border-radius:5px;font-size:12px;z-index:999;opacity:0;transition:opacity 0.3s}.toast.show{opacity:1}
.info{position:fixed;bottom:4px;left:4px;color:#fff;font-size:10px;z-index:999;background:rgba(0,0,0,0.85);padding:5px 8px;border-radius:4px;user-select:text;-webkit-user-select:text;max-width:95vw}
</style></head>
<body>
<div class="tb">
  <h1>Smart <span>Touch</span> Editor</h1>
  <span class="conn off" id="cs">off</span>
  <select id="devSel" onchange="onDev()">
    <option value="iPad 11&quot;">iPad 11"</option><option value="iPad 4:3">iPad 4:3</option>
    <option value="iPad mini">iPad mini</option><option value="Android 16:10">Android 16:10</option>
  </select>
  <select id="gs" onchange="if(profile){profile.defaultSound=this.value;dirty=true}" style="font-size:10px">
    <option value="none">None</option><option value="click">Click</option><option value="soft">Soft</option>
    <option value="mechanical">Mechanical</option><option value="deep">Deep</option>
  </select>
  <button class="btn-save" onclick="saveProfile()">Save & Sync</button>
  <button class="btn-new" onclick="resetDefault()">Reset Default</button>
  <button class="btn-new" onclick="cp()">+ New</button>
</div>
<div class="main">
<div class="side">
  <h3>Profiles</h3><div id="pl"></div>
  <div class="ar"><input id="npn" placeholder="Name"><button onclick="cp()">+</button></div>
  <h3>Pages</h3><div id="pgl"></div>
  <div class="ar"><input id="npl" placeholder="Label"><button onclick="apg()">+</button></div>
  <h3>Zoom</h3>
  <div class="stepper" style="padding:4px 8px"><button onclick="zoomBy(-1)">−</button><span id="zv">60</span><button onclick="zoomBy(1)">+</button></div>
</div>
<div class="carea" id="carea"><div class="cwrap" id="cwrap"><div class="canvas" id="canvas"></div></div></div>
<div class="rp"><h3>Key Properties</h3><div id="pc"><p style="font-size:11px;color:var(--dim)">Click key to edit</p></div></div>
</div>
<div class="toast" id="toast"></div>
<div class="info" id="edinfo"></div>
<script>
"use strict";
let ws=null,profile=null,profiles=[],activePage="",activeProfile="Default.json";
let selKey=null,dirty=false,panX=0,panY=0,panning=false,panStartX=0,panStartY=0,mx=0,my=0;
const DEVS={"iPad 4:3":{w:1024,h:1366},"iPad 11\"":{w:834,h:1210},"iPad mini":{w:744,h:1133},"Android 16:10":{w:1280,h:800}};

// ── WebSocket ──
async function resetDefault(){
  if(!confirm("Reset to default 89-key keyboard? Current layout will be lost."))return;
  try{const r=await fetch("/api/default-template");profile=await r.json();profile.profileName="Default";activePage=profile.pages[0]?.id||"";panX=0;panY=0;dirty=true;renderAll();t("Default layout loaded")}catch(e){t("Failed: "+e,true)}
}
function cws(){
  ws=new WebSocket("ws://"+location.hostname+":8082/ws");
  ws.onopen=()=>{document.getElementById("cs").textContent="connected";document.getElementById("cs").className="conn on"};
  ws.onclose=()=>{document.getElementById("cs").textContent="off";document.getElementById("cs").className="conn off";setTimeout(cws,2000)};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="profile"||m.type==="profile_update"){profile=m.profile;activeProfile=m.filename||activeProfile;activePage=profile.pages.find(p=>p.id===activePage)?activePage:(profile.pages[0]?.id||"");panX=profile.canvasX||0;panY=profile.canvasY||0;renderAll()}};
}

// ── Profile CRUD ──
async function lpl(){const r=await fetch("/api/profiles");profiles=(await r.json()).profiles||[];rpl()}
async function lp(fn){const r=await fetch("/api/profiles/"+fn);profile=await r.json();activeProfile=fn;activePage=profile.pages[0]?.id||"";selKey=null;panX=profile.canvasX||0;panY=profile.canvasY||0;renderAll()}
async function saveProfile(){
  if(!profile)return;
  profile.canvasX=panX;profile.canvasY=panY;
  const r=await fetch("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(profile)});
  const d=await r.json();activeProfile=d.filename;dirty=false;
  if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"profile_saved",filename:d.filename}));
  lpl();t("Saved & synced");
}
async function dp(fn){if(!confirm("Delete "+fn+"?"))return;await fetch("/api/profiles/"+fn,{method:"DELETE"});if(activeProfile===fn){activeProfile="Default.json";await lp("Default.json")}lpl()}
async function cp(){const nm=document.getElementById("npn").value.trim();if(!nm)return;const p={profileName:nm,version:"1.0",device:"iPad 11\"",deviceWidth:834,deviceHeight:1210,cellSize:60,gap:0,canvasX:0,canvasY:0,defaultSound:"click",windowRules:[],pages:[{id:"main",label:"Main",keys:[]}]};const r=await fetch("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});document.getElementById("npn").value="";lpl();lp((await r.json()).filename)}
function apg(){const lb=document.getElementById("npl").value.trim();if(!lb)return;profile.pages.push({id:"p_"+Date.now(),label:lb,keys:[]});activePage=profile.pages[profile.pages.length-1].id;dirty=true;document.getElementById("npl").value="";renderAll()}
function dpg(pid){if(profile.pages.length<=1)return;profile.pages=profile.pages.filter(p=>p.id!==pid);if(activePage===pid)activePage=profile.pages[0].id;selKey=null;dirty=true;renderAll()}
function cp_(){return profile?.pages.find(p=>p.id===activePage)}
function renderAll(){rpl();rpgl();rr();rpr()}
function rpl(){document.getElementById("pl").innerHTML=profiles.map(p=>'<div class="it'+(p.filename===activeProfile?" ac":"")+'" onclick="lp(\''+p.filename+'\')">'+h(p.profileName)+'<span class="x" onclick="event.stopPropagation();dp(\''+p.filename+'\')">×</span></div>').join("")}
function rpgl(){document.getElementById("pgl").innerHTML=profile?.pages.map(p=>'<div class="it'+(p.id===activePage?" ac":"")+'" onclick="activePage=\''+p.id+'\';selKey=null;renderAll()">'+h(p.label)+'<span class="x" onclick="event.stopPropagation();dpg(\''+p.id+'\')">×</span></div>').join("")||""}

// ── Collision detection (AABB) ──
function _overlap(a,b){return !(a.col+a.w<=b.col||b.col+b.w<=a.col||a.row+a.h<=b.row||b.row+b.h<=a.row)}
function _collides(kid,col,row,w,h){
  const page=cp_();if(!page)return false;
  return page.keys.some(k=>k.id!==kid&&_overlap({col,row,w,h},{col:k.col||0,row:k.row||0,w:k.w||1,h:k.h||1}));
}
function _snap4(v){return Math.round(v*4)/4}

// ── Render — 0.25 grid + gap ──
function rr(){
  if(!profile)return;
  const dw=profile.deviceWidth||834,dh=profile.deviceHeight||1210,cs=profile.cellSize||60,gp=profile.gap||0;
  const ca=document.getElementById("carea"),cw=ca.clientWidth,ch=ca.clientHeight;
  document.getElementById("devSel").value=profile.device||"iPad 11\"";
  document.getElementById("gs").value=profile.defaultSound||"none";
  document.getElementById("zv").textContent=cs;

  // Scale canvas to fit carea (85% margin)
  const scale=Math.min(cw*0.85/dw,ch*0.85/dh);
  const wrap=document.getElementById("cwrap");
  wrap.style.width=dw+"px";wrap.style.height=dh+"px";
  wrap.style.transform=`scale(${scale})`;

  const canvas=document.getElementById("canvas");
  canvas.style.width=dw+"px";canvas.style.height=dh+"px";

  // Render keys — cpx = cellSize + gap (1 cell unit in device px)
  const cpx=cs+gp;
  canvas.innerHTML="";
  const page=cp_();if(!page)return;
  page.keys.forEach(k=>{
    const col=k.col||0,row=k.row||0,w=k.w||1,h=k.h||1;
    const x=(col+panX)*cpx+dw/2,y=(row+panY)*cpx+dh/2;
    const kw=w*cs+(w-1)*gp-3,kh=h*cs+(h-1)*gp-3;
    const sel=k.id===selKey?" sel":"";
    const el=document.createElement("div");el.className="ck"+sel;el.dataset.kid=k.id;
    el.style.cssText=`left:${x}px;top:${y}px;width:${kw}px;height:${kh}px;background:${k.color||'var(--card)'};font-size:${Math.max(8,cs*0.25)}px`;
    el.innerHTML='<span class="kl">'+h(k.label)+'</span>'+(w>1||h>1?'<span class="sz">'+w.toFixed(2)+'×'+h.toFixed(2)+'</span>':'')+'<div class="rh"></div>';
    el.addEventListener("mousedown",e=>onKeyDown(e,k.id));
    el.addEventListener("click",e=>{e.stopPropagation();selKey=k.id;rr();rpr()});
    el.querySelector(".rh").addEventListener("mousedown",e=>onRS(e,k.id));
    canvas.appendChild(el);
  });
  document.getElementById("edinfo").textContent=`cw=${cw}x${ch} dw=${dw}x${dh} cs=${cs} gap=${gp} s=${scale.toFixed(3)} pan=(${panX.toFixed(1)},${panY.toFixed(1)})`;
}

// ── Pan (in grid cells) ──
document.getElementById("carea").addEventListener("mousedown",e=>{
  if(e.target.closest(".ck"))return;
  panning=true;panStartX=e.clientX;panStartY=e.clientY;mx=panX;my=panY;e.preventDefault();
});
document.addEventListener("mousemove",e=>{
  if(!panning)return;
  const ca=document.getElementById("carea"),cw=ca.clientWidth,ch=ca.clientHeight;
  const dw=profile.deviceWidth||834,dh=profile.deviceHeight||1210,cs=profile.cellSize||60,gp=profile.gap||0;
  const cpx=cs+gp;
  const scale=Math.min(cw*0.85/dw,ch*0.85/dh);
  panX=mx+(e.clientX-panStartX)/(cpx*scale);
  panY=my+(e.clientY-panStartY)/(cpx*scale);
  rr();
});
document.addEventListener("mouseup",()=>{panning=false});

// ── Zoom ──
document.getElementById("carea").addEventListener("wheel",e=>{e.preventDefault();zoomBy(e.deltaY>0?-1:1)},{passive:false});
function zoomBy(d){const nv=Math.max(20,Math.min(200,(profile.cellSize||60)+d));if(nv!==profile.cellSize){profile.cellSize=nv;dirty=true;rr()}}
function onDev(){const d=DEVS[document.getElementById("devSel").value];if(d&&profile){profile.device=document.getElementById("devSel").value;profile.deviceWidth=d.w;profile.deviceHeight=d.h;dirty=true;rr()}}

// ── Key drag (0.25 snap) ──
function onKeyDown(e,kid){
  if(e.button!==0)return;e.stopPropagation();
  selKey=kid;rr();rpr();
  const k=cp_()?.keys.find(x=>x.id===kid);if(!k)return;
  const cs=profile.cellSize||60,gp=profile.gap||0,cpx=cs+gp;
  const ca=document.getElementById("carea"),cw=ca.clientWidth,ch=ca.clientHeight;
  const dw=profile.deviceWidth||834,dh=profile.deviceHeight||1210;
  const scale=Math.min(cw*0.85/dw,ch*0.85/dh);
  const startX=e.clientX,startY=e.clientY,startCol=k.col||0,startRow=k.row||0;
  function mm(ev){
    const dx=(ev.clientX-startX)/(cpx*scale),dy=(ev.clientY-startY)/(cpx*scale);
    const nc=_snap4(startCol+dx),nr=_snap4(startRow+dy);
    if(!_collides(kid,nc,nr,k.w||1,k.h||1)&&(nc!==k.col||nr!==k.row)){k.col=nc;k.row=nr;dirty=true;rr();selKey=kid}
  }
  function mu(ev){
    document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);
    const el=document.elementFromPoint(ev.clientX,ev.clientY),tk=el?.closest?.(".ck");
    if(tk&&tk.dataset.kid!==kid){
      const a=cp_()?.keys.find(x=>x.id===kid),b=cp_()?.keys.find(x=>x.id===tk.dataset.kid);
      if(a&&b){const ac=a.col,ar=a.row,aw=a.w,ah=a.h;a.col=b.col;a.row=b.row;a.w=b.w;a.h=b.h;b.col=ac;b.row=ar;b.w=aw;b.h=ah;dirty=true;rr();selKey=kid}
    }
  }
  document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);
}

// ── Key resize (0.25 snap + collision) ──
function onRS(e,kid){
  e.preventDefault();e.stopPropagation();selKey=kid;rr();rpr();
  const k=cp_()?.keys.find(x=>x.id===kid);if(!k)return;
  const cs=profile.cellSize||60,gp=profile.gap||0,cpx=cs+gp;
  const ca=document.getElementById("carea"),cw=ca.clientWidth,ch=ca.clientHeight;
  const dw=profile.deviceWidth||834,dh=profile.deviceHeight||1210;
  const scale=Math.min(cw*0.85/dw,ch*0.85/dh);
  const startX=e.clientX,startY=e.clientY,startW=k.w||1,startH=k.h||1,startCol=k.col||0;
  function mm(ev){
    const dw_=_snap4((ev.clientX-startX)/(cpx*scale)),dh_=_snap4((ev.clientY-startY)/(cpx*scale));
    const nw=Math.max(0.25,_snap4(startW+dw_)),nh=Math.max(0.25,_snap4(startH+dh_));
    const ncol=ev.shiftKey?_snap4(startCol-dw_):startCol;
    if(!_collides(kid,ncol,k.row||0,nw,nh)&&(nw!==k.w||nh!==k.h||ncol!==k.col)){k.col=ncol;k.w=nw;k.h=nh;dirty=true;rr();selKey=kid}
  }
  function mu(){document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu)}
  document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);
}

// ── Dblclick to add key (0.25 snap) ──
document.getElementById("carea").addEventListener("dblclick",e=>{
  if(e.target.closest(".ck"))return;
  const ca=document.getElementById("carea"),rect=ca.getBoundingClientRect(),cw=ca.clientWidth,ch=ca.clientHeight;
  const dw=profile.deviceWidth||834,dh=profile.deviceHeight||1210,cs=profile.cellSize||60,gp=profile.gap||0;
  const cpx=cs+gp;
  const scale=Math.min(cw*0.85/dw,ch*0.85/dh);
  const offsetX=(cw-dw*scale)/2,offsetY=(ch-dh*scale)/2;
  const deviceX=(e.clientX-rect.left-offsetX)/scale;
  const deviceY=(e.clientY-rect.top-offsetY)/scale;
  const col=_snap4((deviceX-dw/2)/cpx-panX);
  const row=_snap4((deviceY-dh/2)/cpx-panY);
  const page=cp_();if(!page)return;
  page.keys.push({id:"k_"+Date.now(),label:"?",action:"key",value:"A",color:"#0f3460",col,row,w:1,h:1,sound:""});
  selKey=page.keys[page.keys.length-1].id;dirty=true;rr();rpr();
});

// ── Props ──
function rpr(){
  const key=selKey?cp_()?.keys.find(k=>k.id===selKey):null;
  if(!key){document.getElementById("pc").innerHTML='<p style="font-size:11px;color:var(--dim)">Click key to edit</p>';return}
  const kw=key.w||1,kh=key.h||1;
  document.getElementById("pc").innerHTML=
    '<label>Label</label><input value="'+h(key.label)+'" onchange="upk(\'label\',this.value)">'+
    '<label>Action</label><select onchange="upk(\'action\',this.value)"><option value="key"'+(key.action==="key"?" selected":"")+'>Key Press</option><option value="text"'+(key.action==="text"?" selected":"")+'>Type Text</option></select>'+
    '<label>Value</label><input value="'+h(key.value||"")+'" onchange="upk(\'value\',this.value)"><div class="hint">A, TAB, COMMAND+T</div>'+
    '<label>Color</label><input type="color" value="'+(key.color||"#0f3460")+'" onchange="upk(\'color\',this.value)">'+
    '<label>Sound</label><select onchange="upk(\'sound\',this.value)"><option value=""'+(!key.sound?" selected":"")+'>Inherit</option><option value="none"'+(key.sound==="none"?" selected":"")+'>None</option><option value="click"'+(key.sound==="click"?" selected":"")+'>Click</option><option value="soft"'+(key.sound==="soft"?" selected":"")+'>Soft</option><option value="mechanical"'+(key.sound==="mechanical"?" selected":"")+'>Mechanical</option><option value="deep"'+(key.sound==="deep"?" selected":"")+'>Deep</option></select>'+
    '<div class="rw" style="margin-top:8px"><div><label>Width</label><div class="stepper"><button onclick="upk(\'w\','+_snap4(kw-0.25)+')">−</button><span>'+kw.toFixed(2)+'</span><button onclick="upk(\'w\','+_snap4(kw+0.25)+')">+</button></div></div><div><label>Height</label><div class="stepper"><button onclick="upk(\'h\','+_snap4(kh-0.25)+')">−</button><span>'+kh.toFixed(2)+'</span><button onclick="upk(\'h\','+_snap4(kh+0.25)+')">+</button></div></div></div>'+
    '<div class="br"><button class="btn-del" onclick="dkey()">Delete</button></div>';
}
function upk(prop,val){const key=cp_()?.keys.find(k=>k.id===selKey);if(!key)return;if(prop==="w"||prop==="h")val=Math.max(0.25,_snap4(parseFloat(val)||1));key[prop]=val;dirty=true;rr();rpr()}
function dkey(){if(!selKey||!confirm("Delete?"))return;const p=cp_();p.keys=p.keys.filter(k=>k.id!==selKey);selKey=null;dirty=true;renderAll()}

// ── Sound ──
const SND={none:null,click:[800,0.06,"square",0.3],soft:[400,0.08,"sine",0.2],mechanical:[1200,0.04,"square",0.4],deep:[200,0.1,"triangle",0.5]};
let actx=null;
function testSnd(nm){if(!nm||nm==="none")return;const s=SND[nm];if(!s)return;try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=s[2];o.frequency.setValueAtTime(s[0],actx.currentTime);g.gain.setValueAtTime(s[3],actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+s[1]);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+s[1])}catch(e){}}
