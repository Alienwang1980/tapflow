<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Smart Touch Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#1a1a2e;font-family:-apple-system,sans-serif;color:#eee;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{position:relative}
.key-btn{position:absolute;border:none;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;transition:transform 0.04s;overflow:hidden}
.key-btn:active,.key-btn.active{transform:scale(0.93)}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:4px 8px;background:rgba(22,33,62,0.95);height:32px}
.top-bar h1{font-size:13px}.top-bar span{color:#e94560}
.top-actions{display:flex;gap:4px;align-items:center}
.top-actions select{background:#0f3460;color:#eee;border:1px solid #2a2a4a;border-radius:4px;padding:2px 6px;font-size:10px;max-width:110px}
.top-actions button{background:#0f3460;color:#eee;border:1px solid #2a2a4a;border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer}
.sd{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:2px}
.sd.on{background:#4caf50}.sd.off{background:#f44336}.sd.pending{background:#ff9800;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.st{font-size:9px;color:#888}
.tabs{position:fixed;top:32px;left:0;right:0;z-index:50;display:flex;gap:1px;padding:2px 4px;background:#1a1a2e}
.tb{padding:2px 7px;border-radius:3px 3px 0 0;background:#16213e;color:#888;border:none;font-size:10px;cursor:pointer;touch-action:manipulation}
.tb.on{background:#0f3460;color:#eee}
.info{position:fixed;bottom:4px;left:4px;color:#fff;font-size:10px;z-index:99;background:rgba(0,0,0,0.85);padding:5px 8px;border-radius:4px;user-select:text;-webkit-user-select:text;max-width:95vw}
</style></head>
<body>
<div class="top-bar"><h1>Smart <span>Touch</span></h1>
<div class="top-actions">
  <select id="ps" onchange="onPC()"></select>
  <span class="sd pending" id="sd"></span><span class="st" id="stx"></span>
  <button onclick="showQR()">QR</button>
</div></div>
<div class="tabs" id="tabs"></div>
<div id="info" class="info"></div>
<script>
"use strict";
let profile=null,activePage="",activeProfile="Default.json";
let ws=null,timer=null,delay=1000;

// ── UNIFIED RENDER FORMULA ──
function gridToPixel(col,row,w,h,dw,dh,cs,vw,vh){
  const scale=Math.min(vw/dw,vh/dh);
  const ox=(vw-dw*scale)/2,oy=(vh-dh*scale)/2;
  const px=cs*scale;
  const padX=dw/(2*cs),padY=dh/(2*cs);
  return{x:ox+(col+padX)*px,y:oy+(row+padY)*px,kw:w*px,kh:h*px,scale,ox,oy,px,padX,padY};
}

// ── Sound ──
const SND={none:null,click:[800,0.06,"square",0.3],soft:[400,0.08,"sine",0.2],mechanical:[1200,0.04,"square",0.4],deep:[200,0.1,"triangle",0.5]};
let ctx=null;
function psnd(n){if(!n||n==="none")return;const s=SND[n];if(!s)return;try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=s[2];o.frequency.setValueAtTime(s[0],ctx.currentTime);g.gain.setValueAtTime(s[3],ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+s[1]);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+s[1])}catch(e){}}

// ── WebSocket ──
function conn(){
  const p=location.protocol==="https:"?"wss:":"ws:";
  ws=new WebSocket(p+"//"+location.hostname+":8082/ws");
  ws.onopen=()=>{ss("on");delay=1000};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="profile"||m.type==="profile_update"){profile=m.profile;activeProfile=m.filename||activeProfile;activePage=profile.pages.find(p=>p.id===activePage)?activePage:(profile.pages[0]?.id||"");lpls();render()}else if(m.type==="profile_switch"){activePage=m.page||activePage;render()}};
  ws.onclose=()=>{ss("off");timer=setTimeout(()=>{delay=Math.min(delay*1.5,15000);conn()},delay)};
  ws.onerror=()=>{ss("off")};
}
function ss(cls){document.getElementById("sd").className="sd "+cls;document.getElementById("stx").textContent=cls}

// ── Send key ──
function sendKey(kd){
  if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"key",key:kd.value,action:kd.action==="text"?"text":"press"}));
  psnd(kd.sound||(profile&&profile.defaultSound)||"none");
}

// ── Touch events ──
const active=new Set();let touchUsed=false;
document.addEventListener("touchstart",e=>{e.preventDefault();touchUsed=true;for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i],el=document.elementFromPoint(t.clientX,t.clientY);if(el?.classList.contains("key-btn")){const kid=el.dataset.keyId;if(kid&&!active.has(kid)){active.add(kid);el.classList.add("active");const pg=profile?.pages.find(p=>p.id===activePage),kd=pg?.keys.find(k=>k.id===kid);if(kd)sendKey(kd)}}}},{passive:false});
document.addEventListener("touchend",e=>{e.preventDefault();active.forEach(kid=>{const b=document.querySelector('[data-key-id="'+kid+'"]');if(b)b.classList.remove("active")});active.clear()},{passive:false});
document.addEventListener("touchmove",e=>{e.preventDefault();for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i],el=document.elementFromPoint(t.clientX,t.clientY);if(el?.classList.contains("key-btn")){const kid=el.dataset.keyId;if(kid&&!active.has(kid)){active.forEach(okid=>{const b=document.querySelector('[data-key-id="'+okid+'"]');if(b)b.classList.remove("active")});active.clear();active.add(kid);el.classList.add("active");const pg=profile?.pages.find(p=>p.id===activePage),kd=pg?.keys.find(k=>k.id===kid);if(kd)sendKey(kd)}}}},{passive:false});
document.addEventListener("click",e=>{if(touchUsed){touchUsed=false;return}const el=e.target.closest(".key-btn");if(!el)return;const pg=profile?.pages.find(p=>p.id===activePage),kd=pg?.keys.find(k=>k.id===el.dataset.keyId);if(kd)sendKey(kd)});

// ── Render ──
function render(){
  document.getElementById("tabs").innerHTML=(profile?.pages||[]).map(p=>'<button class="tb'+(p.id===activePage?" on":"")+'" onclick="activePage=\''+p.id+'\';render()">'+p.label+'</button>').join("");
  const pg=profile?.pages.find(p=>p.id===activePage);if(!pg)return;
  const dw=profile.deviceWidth||834,dh=profile.deviceHeight||1210,cs=profile.cellSize||60;
  const vw=window.innerWidth,vh=window.innerHeight;

  document.querySelectorAll(".key-btn").forEach(el=>el.remove());
  let vis=0;
  pg.keys.forEach(k=>{
    const p=gridToPixel(k.col||0,k.row||0,k.w||1,k.h||1,dw,dh,cs,vw,vh);
    if(p.x+p.kw>0&&p.y+p.kh>0&&p.x<vw&&p.y<vh)vis++;
    const el=document.createElement("div");el.className="key-btn";el.dataset.keyId=k.id;
    el.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.kw}px;height:${p.kh}px;background:${k.color||'#0f3460'};font-size:${Math.max(9,p.px*0.2)}px`;
    el.textContent=k.label;document.body.appendChild(el);
  });
  // Draw frame border
  const pp=gridToPixel(0,0,1,1,dw,dh,cs,vw,vh);
  let fb=document.getElementById("frame-box");
  if(!fb){fb=document.createElement("div");fb.id="frame-box";fb.style.cssText="position:fixed;pointer-events:none;z-index:60;border:2px dashed rgba(233,69,96,0.5);border-radius:4px";document.body.appendChild(fb);}
  fb.style.left=pp.ox+"px";fb.style.top=pp.oy+"px";fb.style.width=(dw*pp.scale)+"px";fb.style.height=(dh*pp.scale)+"px";
  document.getElementById("info").textContent=`KEYS:${vis}/${pg.keys.length} | DEV:${dw}x${dh} | vw=${vw} vh=${vh} | s=${pp.scale.toFixed(3)} | cs=${cs} padX=${pp.padX.toFixed(1)}`;
}

// ── Load ──
async function load(){
  try{const r=await fetch("/api/profiles/Default.json");profile=await r.json();activeProfile="Default.json";activePage=profile.pages[0]?.id||"";render()}catch(e){}
  conn();lpls();
}
async function lpls(){try{const r=await fetch("/api/profiles");const d=await r.json();document.getElementById("ps").innerHTML=d.profiles.map(p=>'<option value="'+p.filename+'"'+(p.filename===activeProfile?" selected":"")+'>'+p.profileName+'</option>').join("")}catch(e){}}
async function onPC(){const fn=document.getElementById("ps").value;try{const r=await fetch("/api/profiles/"+fn);if(!r.ok)return;profile=await r.json();activeProfile=fn;activePage=profile.pages[0]?.id||"";render()}catch(e){}}
function showQR(){const url="http://"+location.hostname+":8082";prompt("Scan or open:",url)}
window.addEventListener("resize",render);window.addEventListener("orientationchange",()=>setTimeout(render,300));
load();
</script></body></html>
