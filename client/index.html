<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Smart Touch Panel</title>
<style>
:root {
  --bg: #1a1a2e; --panel-bg: #16213e;
  --key-default: #0f3460; --key-active: #e94560;
  --text: #eee; --text-dim: #888; --border: #2a2a4a; --accent: #e94560;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
/* ── Layout ── */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; background: var(--panel-bg);
  border-bottom: 1px solid var(--border); height: 40px; flex-shrink: 0;
}
.top-bar h1 { font-size: 15px; font-weight: 600; }
.top-bar h1 span { color: var(--accent); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.status-dot.connect { background: #4caf50; }
.status-dot.disconnect { background: #f44336; }
.status-dot.connecting { background: #ff9800; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.status-text { font-size: 11px; color: var(--text-dim); }
.top-actions { display: flex; gap: 6px; align-items: center; }
.top-actions select, .top-actions button {
  background: var(--key-default); color: var(--text); border: 1px solid var(--border);
  border-radius: 5px; padding: 3px 8px; font-size: 12px; cursor: pointer;
}
/* ── Tabs ── */
.tabs {
  display: flex; gap: 1px; padding: 4px 6px; background: var(--bg);
  overflow-x: auto; -webkit-overflow-scrolling: touch; flex-shrink: 0;
}
.tab-btn {
  padding: 6px 14px; border-radius: 6px 6px 0 0;
  background: var(--panel-bg); color: var(--text-dim);
  border: none; font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap; touch-action: manipulation;
}
.tab-btn.active { background: var(--key-default); color: var(--text); }
/* ── Grid ── */
.grid-wrap { flex: 1; overflow-y: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
.key-grid { display: grid; gap: 3px; padding: 2px; }
.key-btn {
  position: relative; background: var(--key-default);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-size: 13px; font-weight: 500;
  min-height: 40px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; touch-action: none;
  transition: transform 0.04s, background 0.04s;
  -webkit-tap-highlight-color: transparent;
}
.key-btn:active, .key-btn.active {
  background: var(--key-active); transform: scale(0.92); border-color: var(--accent);
}
.key-label { pointer-events: none; text-align: center; line-height: 1.1; font-size: inherit; }
/* ── Editor mode (PC) ── */
.editor-panel {
  display: none; position: fixed; right: 0; top: 40px; bottom: 0;
  width: 320px; background: var(--panel-bg); border-left: 2px solid var(--border);
  z-index: 50; overflow-y: auto; padding: 14px; flex-direction: column; gap: 10px;
}
.editor-panel.open { display: flex; }
.editor-panel h3 { font-size: 14px; margin-bottom: 4px; }
.editor-panel label { font-size: 11px; color: var(--text-dim); }
.editor-panel input, .editor-panel select {
  width: 100%; padding: 6px 8px; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 4px; font-size: 12px; margin-bottom: 6px;
}
.editor-panel button {
  padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border);
  cursor: pointer; font-size: 12px; margin-right: 4px;
}
.btn-save { background: #3a7ca5; color: #fff; }
.btn-del { background: #8b3a3a; color: #fff; }
.btn-add { background: #3a7ca5; color: #fff; }
.btn-json { background: #555; color: #fff; }
/* ── QR modal ── */
.qr-modal {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center;
}
.qr-modal.open { display: flex; }
.qr-card {
  background: var(--panel-bg); border: 2px solid var(--accent);
  border-radius: 12px; padding: 24px; text-align: center; max-width: 320px;
}
.qr-card h2 { font-size: 18px; margin-bottom: 12px; }
.qr-card .url { font-size: 16px; color: var(--accent); word-break: break-all; margin-bottom: 12px; }
.qr-card canvas { margin: 12px auto; display: block; }
.qr-card button {
  padding: 8px 20px; background: var(--accent); color: #fff;
  border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
}
/* ── Safe area ── */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  body { padding-bottom: env(safe-area-inset-bottom); }
}
@media (max-width: 600px) {
  .key-btn { font-size: 11px; min-height: 34px; border-radius: 4px; }
  .editor-panel { width: 100%; }
}
</style>
</head>
<body>
<div class="top-bar">
  <h1>Smart <span>Touch</span></h1>
  <div class="top-actions">
    <select id="profileSelect" onchange="onProfileChange()"></select>
    <span class="status-dot connecting" id="statusDot"></span>
    <span class="status-text" id="statusText">connecting</span>
    <button onclick="showQR()" title="Show QR code">QR</button>
    <button id="editorToggle" onclick="toggleEditor()" style="display:none">Edit</button>
  </div>
</div>
<div class="tabs" id="tabs"></div>
<div class="grid-wrap"><div class="key-grid" id="keyGrid"></div></div>

<!-- Editor panel (PC mode) -->
<div class="editor-panel" id="editorPanel">
  <h3>Key Editor</h3>
  <label>Label</label><input id="edLabel" onchange="onEditorFieldChange()">
  <label>Key Combo</label><input id="edValue" onchange="onEditorFieldChange()" placeholder="COMMAND+T">
  <label>Action</label><select id="edAction" onchange="onEditorFieldChange()">
    <option value="key">Key Press</option><option value="text">Type Text</option>
  </select>
  <label>Color</label><input type="color" id="edColor" onchange="onEditorFieldChange()" style="height:30px">
  <div style="display:flex;gap:6px;margin-top:8px">
    <button class="btn-save" onclick="saveKeyEdit()">Save Key</button>
    <button class="btn-del" onclick="deleteKey()">Delete</button>
  </div>
  <hr style="border-color:var(--border);margin:8px 0">
  <h3>Page</h3>
  <input id="edPageLabel" placeholder="Page label" onchange="onEditorFieldChange()">
  <input id="edPageId" placeholder="Page ID" onchange="onEditorFieldChange()">
  <div style="display:flex;gap:6px;margin-top:6px">
    <button class="btn-add" onclick="addPage()">Add Page</button>
    <button class="btn-del" onclick="deletePage()">Delete Page</button>
  </div>
  <hr style="border-color:var(--border);margin:8px 0">
  <h3>Profile</h3>
  <input id="edProfileName" placeholder="Profile name" onchange="onEditorFieldChange()">
  <div style="display:flex;gap:6px;margin-top:6px">
    <button class="btn-save" onclick="saveProfile()">Save Profile</button>
    <button class="btn-json" onclick="exportJSON()">Export JSON</button>
  </div>
  <div style="margin-top:4px"><button class="btn-add" onclick="addKeyToCurrentPage()">+ Add Key to Page</button></div>
  <div id="editorStatus" style="font-size:11px;color:var(--accent);margin-top:6px"></div>
</div>

<!-- QR Modal -->
<div class="qr-modal" id="qrModal" onclick="closeQR(event)">
  <div class="qr-card" onclick="event.stopPropagation()">
    <h2>Scan to Connect</h2>
    <div class="url" id="qrUrl"></div>
    <canvas id="qrCanvas"></canvas>
    <button onclick="closeQR()">Close</button>
  </div>
</div>

<script>
"use strict";
// ── State ──
let ws = null, profile = null, profiles = [], activePageId = "", activeProfileFile = "Default.json";
let reconnectTimer = null, reconnectDelay = 1000;
let editingKeyId = null, dirty = false;
let editorOpen = false;

// ── Detect PC vs Tablet ──
const isPC = window.innerWidth > 900 && !('ontouchstart' in window);
if (isPC) { document.getElementById('editorToggle').style.display = ''; }

// ── WebSocket ──
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(proto + "//" + location.hostname + ":8082/ws");
  ws.onopen = () => { setStatus("connect", "connected"); reconnectDelay = 1000; };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "profile") {
      profile = msg.profile; activeProfileFile = msg.filename || "Default.json";
      if (!activePageId || !profile.pages.find(p => p.id === activePageId)) {
        activePageId = profile.pages[0]?.id || "";
      }
      loadProfileList(); renderAll();
    } else if (msg.type === "profile_switch") {
      activePageId = msg.page || activePageId;
      renderAll();
    }
  };
  ws.onclose = () => { setStatus("disconnect", "disconnected"); scheduleReconnect(); };
  ws.onerror = () => { setStatus("disconnect", "error"); };
}
function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  setStatus("connecting", "retry " + Math.round(reconnectDelay/1000) + "s");
  reconnectTimer = setTimeout(() => { reconnectDelay = Math.min(reconnectDelay*1.5, 15000); connect(); }, reconnectDelay);
}
function setStatus(cls, text) {
  document.getElementById("statusDot").className = "status-dot " + cls;
  document.getElementById("statusText").textContent = text;
}

// ── Key sending ──
function sendKey(keyDef) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({type: "key", key: keyDef.value, action: keyDef.action === "text" ? "text" : "press"}));
}

// ── Multi-touch ──
const activeTouches = new Set();
document.addEventListener("touchstart", e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el?.classList.contains("key-btn")) {
      const kid = el.dataset.keyId;
      if (kid && !activeTouches.has(kid)) {
        activeTouches.add(kid); el.classList.add("active");
        const page = profile?.pages.find(p => p.id === activePageId);
        const kd = page?.keys.find(k => k.id === kid);
        if (kd) sendKey(kd);
        if (isPC && editorOpen) selectKey(kid);
      }
    }
  }
}, {passive: false});
document.addEventListener("touchend", e => {
  e.preventDefault();
  activeTouches.forEach(kid => {
    const btn = document.querySelector('[data-key-id="'+kid+'"]');
    if (btn) btn.classList.remove("active");
  });
  activeTouches.clear();
}, {passive: false});
document.addEventListener("touchmove", e => { e.preventDefault(); }, {passive: false});

// ── Click (for PC testing) ──
document.addEventListener("click", e => {
  const el = e.target.closest(".key-btn");
  if (!el) return;
  const kid = el.dataset.keyId;
  const page = profile?.pages.find(p => p.id === activePageId);
  const kd = page?.keys.find(k => k.id === kid);
  if (kd) sendKey(kd);
  if (isPC && editorOpen) selectKey(kid);
});

// ── Render ──
function renderAll() { renderTabs(); renderGrid(); }
function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = (profile?.pages||[]).map(p =>
    '<button class="tab-btn'+(p.id===activePageId?' active':'')+'" onclick="switchPage(\''+p.id+'\')">'+p.label+'</button>'
  ).join("");
}
function renderGrid() {
  const grid = document.getElementById("keyGrid");
  const page = profile?.pages.find(p => p.id === activePageId);
  if (!page) { grid.innerHTML = ""; return; }
  const cols = page.columns || 15;
  grid.style.gridTemplateColumns = "repeat("+cols+", 1fr)";
  grid.innerHTML = page.keys.map(k => {
    const w = k.w || 1;
    const style = "background:"+(k.color||'var(--key-default)')+";grid-column:span "+w;
    const cls = "key-btn" + (editingKeyId === k.id && editorOpen ? " active" : "");
    return '<button class="'+cls+'" data-key-id="'+k.id+'" style="'+style+'"><span class="key-label">'+k.label+'</span></button>';
  }).join("");
}

function switchPage(pageId) { activePageId = pageId; editingKeyId = null; renderAll(); updateEditorPanel(); }

// ── Profile list ──
async function loadProfileList() {
  try {
    const r = await fetch("/api/profiles");
    const data = await r.json();
    profiles = data.profiles || [];
    const sel = document.getElementById("profileSelect");
    sel.innerHTML = profiles.map(p =>
      '<option value="'+p.filename+'"'+(p.filename===activeProfileFile?' selected':'')+'>'+p.profileName+'</option>'
    ).join("");
  } catch(e) { console.error("loadProfiles:", e); }
}
async function onProfileChange() {
  const fn = document.getElementById("profileSelect").value;
  try {
    const r = await fetch("/api/profiles/"+fn);
    if (!r.ok) return;
    profile = await r.json();
    activeProfileFile = fn;
    activePageId = profile.pages[0]?.id || "";
    renderAll(); updateEditorPanel();
  } catch(e) { console.error(e); }
}
async function saveProfile() {
  if (!profile) return;
  profile.profileName = document.getElementById("edProfileName").value || profile.profileName;
  try {
    const r = await fetch("/api/profiles", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify(profile)
    });
    const data = await r.json();
    activeProfileFile = data.filename;
    dirty = false; loadProfileList();
    setEditorStatus("Saved: "+data.filename);
  } catch(e) { setEditorStatus("Error: "+e); }
}

// ── Editor ──
function toggleEditor() { editorOpen = !editorOpen; document.getElementById("editorPanel").classList.toggle("open", editorOpen); if (editorOpen) updateEditorPanel(); }
function selectKey(kid) { editingKeyId = kid; updateEditorPanel(); }
function updateEditorPanel() {
  if (!editorOpen) return;
  const page = profile?.pages.find(p => p.id === activePageId);
  const key = editingKeyId ? page?.keys.find(k => k.id === editingKeyId) : null;
  document.getElementById("edLabel").value = key?.label || "";
  document.getElementById("edValue").value = key?.value || "";
  document.getElementById("edAction").value = key?.action || "key";
  document.getElementById("edColor").value = key?.color || "#0f3460";
  document.getElementById("edPageLabel").value = page?.label || "";
  document.getElementById("edPageId").value = page?.id || "";
  document.getElementById("edProfileName").value = profile?.profileName || "";
}
function onEditorFieldChange() {
  const page = profile?.pages.find(p => p.id === activePageId);
  const key = editingKeyId ? page?.keys.find(k => k.id === editingKeyId) : null;
  if (key) {
    key.label = document.getElementById("edLabel").value;
    key.value = document.getElementById("edValue").value;
    key.action = document.getElementById("edAction").value;
    key.color = document.getElementById("edColor").value;
  }
  if (page) {
    page.label = document.getElementById("edPageLabel").value;
    page.id = document.getElementById("edPageId").value;
    if (activePageId !== page.id) { activePageId = page.id; }
  }
  if (profile) profile.profileName = document.getElementById("edProfileName").value;
  dirty = true; renderAll();
}
function saveKeyEdit() { onEditorFieldChange(); setEditorStatus("Key updated (Save profile to persist)"); }
function deleteKey() {
  if (!editingKeyId) return;
  const page = profile?.pages.find(p => p.id === activePageId);
  if (!page) return;
  page.keys = page.keys.filter(k => k.id !== editingKeyId);
  editingKeyId = null; dirty = true; renderAll(); updateEditorPanel();
}
function addKeyToCurrentPage() {
  const page = profile?.pages.find(p => p.id === activePageId);
  if (!page) return;
  const id = "new_" + Date.now();
  page.keys.push({id, label:"?", action:"key", value:"A", color:"#0f3460", w:1});
  editingKeyId = id; dirty = true; renderAll(); updateEditorPanel();
}
function addPage() {
  const id = "page_" + Date.now();
  profile.pages.push({id, label:"New Page", columns:4, keys:[{id:"k1",label:"A",action:"key",value:"A",color:"#3a7ca5",w:1}]});
  activePageId = id; dirty = true; renderAll(); updateEditorPanel();
}
function deletePage() {
  if (profile.pages.length <= 1) return;
  const idx = profile.pages.findIndex(p => p.id === activePageId);
  profile.pages.splice(idx, 1);
  activePageId = profile.pages[0]?.id || ""; dirty = true; renderAll(); updateEditorPanel();
}
function exportJSON() {
  const blob = new Blob([JSON.stringify(profile, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = (profile.profileName||"profile")+".json"; a.click();
}
function setEditorStatus(msg) { document.getElementById("editorStatus").textContent = msg; setTimeout(() => { document.getElementById("editorStatus").textContent = ""; }, 3000); }

// ── QR Code ──
function showQR() {
  document.getElementById("qrModal").classList.add("open");
  const url = "http://" + location.hostname + ":8082";
  document.getElementById("qrUrl").textContent = url;
  const canvas = document.getElementById("qrCanvas");
  // Simple QR generation using Google Charts API fallback
  const img = new Image();
  img.onload = () => {
    canvas.width = 200; canvas.height = 200;
    canvas.getContext("2d").drawImage(img, 0, 0, 200, 200);
  };
  img.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(url);
}
function closeQR(e) { if (!e || e.target === document.getElementById("qrModal")) { document.getElementById("qrModal").classList.remove("open"); } }

// ── Init ──
connect();
setTimeout(() => { if (!profile) { ws?.close(); } }, 5000);
</script>
</body>
</html>
