/* Flexbox centering — body is the centering container */
body{display:flex;align-items:center;justify-content:center}
/* Canvas container — scaled to fit viewport, centered by flexbox */
.canvas-wrap{flex-shrink:0;transform-origin:center center}
/* Fixed-size canvas at device dimensions */
.canvas{position:relative;overflow:hidden}
.key-btn{position:absolute;border:none;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:500;transition:transform 0.04s;overflow:hidden}
.key-btn{transition:transform 0.08s ease,box-shadow 0.08s ease,filter 0.08s ease}.key-btn:active,.key-btn.active{transform:scale(0.93);filter:brightness(1.4);box-shadow:0 2px 8px rgba(255,255,255,0.3)}.key-btn.touchpad{border:1px solid rgba(255,255,255,0.06);opacity:0.9}.key-btn.touchpad:active{transform:none!important;filter:none!important;box-shadow:none!important}
.info{display:none;position:fixed;bottom:4px;left:4px;color:#fff;font-size:10px;z-index:99;background:rgba(0,0,0,0.7);padding:4px 6px;border-radius:3px;user-select:text;-webkit-user-select:text}

// ── Render — Flexbox centering + CSS transform scale ──

  canvas.style.width=dw+"px";canvas.style.height=dh+"px";

    const w=k.w||1,h=k.h||1;
    const x=(k.col+cx)*cpx+dw/2;

    const kw=w*cs+(w-1)*gp-3,kh=h*cs+(h-1)*gp-3;
    if(x+kw>0&&y+kh>0&&x<dw&&y<dh)vis++;
    const el=document.createElement("div");el.className="key-btn"+(k.action==="touchpad"?" touchpad":k.action==="visualizer"?" visualizer":k.action==="balance"?" balance":"");el.dataset.keyId=k.id;
    const brPct=(k.borderRadius!==undefined?k.borderRadius:10)/100;const br=(brPct*Math.min(kw,kh))+'px';const ff=k.fontFamily||'inherit';const fs=(k.fontSize||Math.max(8,cs*0.25))+'px';let bg=k.color||'#0f3460';if(k.action==='visualizer')bg='#0a1f14';if(k.action==='balance')bg='#1a1405';let fc=k.fontColor||'inherit';if(k.bgType==='gradient'&&k.bgGradient){const c=k.color||'#0f3460';const m={'top-down':'linear-gradient(180deg,'+c+' 0%,rgba(0,0,0,0.6) 100%)','left-right':'linear-gradient(90deg,'+c+' 0%,rgba(0,0,0,0.6) 100%)','diagonal-tl':'linear-gradient(135deg,'+c+' 0%,rgba(0,0,0,0.6) 100%)','diagonal-tr':'linear-gradient(225deg,'+c+' 0%,rgba(0,0,0,0.6) 100%)','radial':'radial-gradient(circle,'+c+' 0%,rgba(0,0,0,0.6) 100%)'};bg=m[k.bgGradient]||c}else if(k.bgType==='image'&&k.bgImage){bg='#0f3460 url(/'+k.bgImage+') center/cover'};el.style.cssText=`left:${x}px;top:${y}px;width:${kw}px;height:${kh}px;background:${bg};color:${fc};border-radius:${br};font-family:${ff};font-size:${fs}`;
    if(k.action==="visualizer"){var _cv=document.createElement("canvas");_cv.width=kw-8;_cv.height=kh-8;_cv.style.borderRadius="3px";el.appendChild(_cv);el.style.cssText+="color:#4ade80";_drawSpectrum(_cv,[]);}else if(k.action==="balance"){var _apiKey=k.apiKey||"";var _cv=document.createElement("canvas");_cv.width=kw-8;_cv.height=kh-8;_cv.style.borderRadius="4px";el.appendChild(_cv);_drawBalance(_cv,{total_balance:"0",granted_balance:"0",topped_up_balance:"0",currency:"CNY"},"Loading...");if(_apiKey){_fetchBalanceCanvas(_cv,_apiKey);setInterval(function(){_fetchBalanceCanvas(_cv,_apiKey)},30000)}else{_drawBalance(_cv,null,"No API key")}}else{el.textContent=k.label}canvas.appendChild(el);
  });
  document.getElementById("info").textContent=`keys ${vis}/${pg.keys.length} | ${dw}×${dh} cs${cs} gap${gp} | vw${vw}×${vh}h | scale ${scale.toFixed(3)} | cx${cx.toFixed(1)} cy${cy.toFixed(1)}`;
}

window.addEventListener("resize",render);
window.addEventListener("orientationchange",()=>setTimeout(render,300));

  try{const r=await fetch("/api/active-profile");const d=await r.json();profile=d.profile;activeProfile=d.filename||"Default.json";activePage=profile.pages[0]?.id||"";profileLoaded=true;render()}catch(e){document.getElementById("info").textContent="ERR:"+(e.message||e);document.getElementById("info").style.display="block"}
  conn();
}

load();
