<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>STP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#1a1a2e;font-family:sans-serif}
body{position:relative}
.key-btn{position:absolute;border:none;border-radius:5px;color:#eee;font-size:14px;display:flex;align-items:center;justify-content:center}
.info{position:fixed;bottom:6px;left:6px;color:#555;font-size:10px;background:rgba(0,0,0,0.7);padding:3px 8px;border-radius:3px;z-index:99}
</style></head>
<body>
<div id="info" class="info">loading...</div>
<script>
async function load(){
  const r=await fetch("/api/profiles/Default.json");
  const profile=await r.json();
  const pg=profile.pages[0];
  const dw=profile.deviceWidth,dh=profile.deviceHeight,cs=profile.cellSize;
  const cx=profile.canvasX||0,cy=profile.canvasY||0;
  const vw=window.innerWidth,vh=window.innerHeight;
  const scale=Math.min(vw/dw,vh/dh);
  const ox=(vw-dw*scale)/2,oy=(vh-dh*scale)/2;
  const cx_cells=cx/60,cy_cells=cy/60;
  const padX=dw/(2*cs),padY=dh/(2*cs);
  let vis=0;
  pg.keys.forEach(k=>{
    const x=ox+(k.col-cx_cells+padX)*cs*scale;
    const y=oy+(k.row-cy_cells+padY)*cs*scale;
    const kw=k.w*cs*scale,kh=k.h*cs*scale;
    if(x+kw>0&&y+kh>0&&x<vw&&y<vh)vis++;
    const el=document.createElement("div");
    el.className="key-btn";
    el.style.cssText=`left:${x}px;top:${y}px;width:${kw}px;height:${kh}px;background:${k.color||'#0f3460'}`;
    el.textContent=k.label;
    document.body.appendChild(el);
  });
  document.getElementById("info").textContent=`vw=${vw} vh=${vh} s=${scale.toFixed(2)} cx=${cx} padX=${padX.toFixed(1)} padY=${padY.toFixed(1)} | ${vis}/${pg.keys.length}`;
}
load();
window.addEventListener("resize",render);
window.addEventListener("orientationchange",()=>setTimeout(render,300));
</script></body></html>
