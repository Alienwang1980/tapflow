const SND={none:null,click:[800,0.06,"square",0.3],soft:[400,0.08,"sine",0.2],mechanical:[1200,0.04,"square",0.4],deep:[200,0.1,"triangle",0.5],red:[300,0.04,"sine",0.15],topre:[500,0.07,"sine",0.18,900,0.008],glass:[2400,0.05,"sine",0.12],bubble:[600,0.06,"sine",0.22,"sweep"],blip:[440,0.05,"square",0.2,"sweep"],spark:[3000,0.02,"sawtooth",0.1,0.4],quit:[600,0.18,"sawtooth",0.22,300,0.1]};

function _drawSpectrum(canvas,bands){var ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);if(!bands||!bands.length){ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(0,0,w,h);ctx.fillStyle="#4ade80";var fs=Math.max(11,Math.min(h*0.18,w*0.05));ctx.font=fs+"px -apple-system,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("Audio Spectrum",w/2,h/2);return}var n=bands.length,bw=Math.max(2,(w-n*2)/n);for(var i=0;i<n;i++){var bh=bands[i]*h*0.9,x=i*(bw+2)+2,y=h-bh,g=ctx.createLinearGradient(x,y,x,h);g.addColorStop(0,"#4ade80");g.addColorStop(1,"rgba(74,222,128,0.15)");ctx.fillStyle=g;ctx.fillRect(x,y,bw,bh)}}
function _fetchBalanceCanvas(canvas,apiKey,showFlags){if(!apiKey)return;canvas._showFlags=showFlags;var u="/api/deepseek/balance?api_key="+encodeURIComponent(apiKey);fetch(u).then(function(r){return r.json()}).then(function(d){var bi=(d.balance_infos||[])[0];_drawBalance(canvas,bi||d,null,canvas._showFlags)}).catch(function(){_drawBalance(canvas,null,"Error",canvas._showFlags)})}
function _drawBalance(canvas,data,label,showFlags){var ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle="rgba(0,0,0,0.35)";ctx.fillRect(0,0,w,h);if(!data||label){ctx.fillStyle="#f59e0b";var fs=Math.max(10,Math.min(h*0.2,w*0.06));ctx.font="bold "+fs+"px -apple-system,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(label||"No data",w/2,h/2);return}var total=parseFloat(data.total_balance)||0,granted=parseFloat(data.granted_balance)||0,topped=parseFloat(data.topped_balance)||0,currency=data.currency||"CNY";ctx.fillStyle="#f59e0b";var fs1=Math.max(9,Math.min(h*0.15,w*0.035));ctx.font="bold "+fs1+"px -apple-system,sans-serif";ctx.textAlign="left";ctx.textBaseline="top";ctx.fillText("Deepseek",w*0.04,h*0.06);if(showAll||(showFlags&&showFlags.total)){ctx.fillStyle="#e8e0d8";var fs2=Math.max(18,Math.min(h*0.35,w*0.07));ctx.font="bold "+fs2+"px -apple-system,sans-serif";ctx.fillText(currency+" "+total.toFixed(2),w*0.04,h*0.25);ctx.fillStyle="#8b8078";var fs3=Math.max(8,Math.min(h*0.1,w*0.028));ctx.font=fs3+"px -apple-system,sans-serif";ctx.fillText("total balance",w*0.04,h*0.25+fs2+4);}var showAll=!showFlags||showFlags.total;var ly=h*0.62;if(showAll||(showFlags&&showFlags.topped)){ctx.fillStyle="#f59e0b";ctx.font=Math.max(9,Math.min(h*0.13,w*0.032))+"px -apple-system,sans-serif";ctx.textBaseline="middle";ctx.fillText("Topped up",w*0.04,ly);ctx.fillStyle="#e8e0d8";ctx.textAlign="right";ctx.fillText(currency+" "+topped.toFixed(2),w*0.96,ly);ly+=h*0.16}if(showAll||(showFlags&&showFlags.granted)){ctx.textAlign="left";ctx.fillStyle="#8b8078";ctx.fillText("Granted",w*0.04,ly);ctx.fillStyle="#e8e0d8";ctx.textAlign="right";ctx.fillText(currency+" "+granted.toFixed(2),w*0.96,ly)}}
function psnd(n){if(!n||n==="none")return;const s=SND[n];if(!s)return;try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=s[2];if(s[4]==="sweep"){o.frequency.setValueAtTime(s[0]*1.5,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(s[0]*0.5,ctx.currentTime+s[1])}else{o.frequency.setValueAtTime(s[0],ctx.currentTime)}g.gain.setValueAtTime(s[3],ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+s[1]);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+s[1]);if(s.length===6){const o2=ctx.createOscillator(),g2=ctx.createGain();o2.type="square";o2.frequency.setValueAtTime(s[4],ctx.currentTime+0.003);g2.gain.setValueAtTime(s[3]*0.5,ctx.currentTime+0.003);g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+s[5]);o2.connect(g2);g2.connect(ctx.destination);o2.start(ctx.currentTime+0.003);o2.stop(ctx.currentTime+s[5])}if(s.length===5&&typeof s[4]==="number"){const bs=ctx.sampleRate*s[1],buf=ctx.createBuffer(1,bs,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*s[4];const ns=ctx.createBufferSource(),gn=ctx.createGain();ns.buffer=buf;gn.gain.setValueAtTime(s[3]*0.3,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+s[1]*0.5);ns.connect(gn);gn.connect(ctx.destination);ns.start(ctx.currentTime)}}catch(e){}}
// ── Media Control Widgets (volume, mute, mic-mute, audio devices) ──

function _drawVolumeSlider(canvas, value, muted) {
  var ctx = canvas.getContext("2d"), w = canvas.width, h = canvas.height;
  // Only clear slider area (left portion), leave mute area intact
  var muteX = canvas._muteX || (w - h + 2);
  ctx.clearRect(0, 0, muteX - 2, h);
  var sliderW = muteX - 4;
  var margin = 4, barH = Math.max(8, h * 0.35);
  var barY = (h - barH) / 2, barW = sliderW - 8;
  var displayVal = muted ? 0 : value;
  // Background track
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  ctx.fillRect(margin, barY, barW, barH);
  // Fill
  var fillW = barW * (displayVal / 100);
  var g = ctx.createLinearGradient(margin, 0, margin + barW, 0);
  g.addColorStop(0, "#4ade80"); g.addColorStop(1, "#22c55e");
  ctx.fillStyle = muted ? "rgba(239,68,68,0.3)" : g;
  ctx.fillRect(margin, barY, fillW, barH);
  // Knob
  ctx.fillStyle = "#fff"; ctx.beginPath();
  ctx.arc(margin + fillW, barY + barH/2, barH * 0.6, 0, Math.PI*2); ctx.fill();
  // Label
  var fs = Math.max(9, h * 0.3);
  ctx.fillStyle = muted ? "#ef4444" : "#aaa";
  ctx.font = "bold " + fs + "px -apple-system,sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "bottom";
  ctx.fillText(muted ? "MUTED" : Math.round(value) + "%", margin, barY - 2);
  canvas._volValue = value; canvas._volMargin = margin; canvas._volBarW = barW;
}

function _drawMuteIcon(canvas, muted) {
  var ctx = canvas.getContext("2d"), w = canvas.width, h = canvas.height;
  var muteW = h - 4;
  var muteX = w - muteW - 2;
  canvas._muteX = muteX; canvas._muteW = muteW;
  ctx.clearRect(muteX - 2, 0, muteW + 4, h);
  // Separator
  ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(muteX - 1, 4); ctx.lineTo(muteX - 1, h - 4); ctx.stroke();
  // Icon bg
  ctx.fillStyle = muted ? "rgba(239,68,68,0.2)" : "rgba(255,255,255,0.05)";
  ctx.fillRect(muteX, 2, muteW, h - 4);
  // Icon text
  var icx = muteX + muteW/2, icy = h/2;
  ctx.fillStyle = muted ? "#ef4444" : "#888";
  ctx.font = Math.max(8, muteW*0.35) + "px -apple-system,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("M", icx, icy);
  if (muted) {
    ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(icx-6, icy-6); ctx.lineTo(icx+6, icy+6); ctx.stroke();
  }
  canvas._volMuted = muted;
}

// ── Volume Slider + Mute (combined widget) ──

function _drawVolume(canvas, value, muted) {
  // Draw mute icon once, only update when mute state changes
  if (canvas._lastMuted !== muted) {
    _drawMuteIcon(canvas, muted);
    canvas._lastMuted = muted;
  }
  // Always draw slider
  _drawVolBar(canvas, value, muted);
  canvas._volValue = value; canvas._volMuted = muted;
}

function _drawMuteIcon(canvas, muted) {
  var ctx = canvas.getContext("2d"), w = canvas.width, h = canvas.height;
  var muteW = h - 4;
  var muteX = w - muteW - 2;
  canvas._muteX = muteX; canvas._muteW = muteW;
  // Clear mute area + separator
  ctx.clearRect(muteX - 2, 0, muteW + 4, h);
  ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(muteX - 1, 4); ctx.lineTo(muteX - 1, h - 4); ctx.stroke();
  // Icon
  var icx = muteX + muteW/2, icy = h/2;
  ctx.fillStyle = muted ? "rgba(239,68,68,0.2)" : "rgba(255,255,255,0.05)";
  ctx.fillRect(muteX, 2, muteW, h - 4);
  ctx.fillStyle = muted ? "#ef4444" : "#888";
  ctx.font = Math.max(8, muteW*0.35) + "px -apple-system,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("M", icx, icy);
  if (muted) {

function _drawVolBar(canvas, value, muted) {
  var ctx = canvas.getContext("2d"), w = canvas.width, h = canvas.height;
  var muteX = canvas._muteX || (w - h + 2);
  // Clear slider area only
  ctx.clearRect(0, 0, muteX - 2, h);

  var displayVal = muted ? 0 : value;

  var barY = (h - barH) / 2, barW = muteX - margin - 4;
  canvas._volMargin = margin; canvas._volBarW = barW;
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  ctx.fillRect(margin, barY, barW, barH);
  var fillW = barW * (displayVal / 100);
  var g = ctx.createLinearGradient(margin, 0, margin + barW, 0);
  g.addColorStop(0, "#4ade80"); g.addColorStop(1, "#22c55e");
  ctx.fillStyle = muted ? "rgba(239,68,68,0.3)" : g;
  ctx.fillRect(margin, barY, fillW, barH);

  var fs = Math.max(9, h * 0.3);

function _onVolumeTouchStart(e, canvas) {
  e.stopPropagation();
  var rect = canvas.getBoundingClientRect();
  var x = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) * (canvas.width / rect.width);
  // Mute button area
  if (x >= (canvas._muteX || 999)) {
    fetch("/api/system/mute", {method:"POST"}).then(function(r){return r.json()}).then(function(d){
      _drawVolume(canvas, canvas._volValue || 50, d.muted);
    }).catch(function(){});
    return;
  }
  // Slider
  canvas._volDragging = true;
  var v = Math.round(((x - canvas._volMargin) / canvas._volBarW) * 100);
  v = Math.max(0, Math.min(100, v));
  canvas._volValue = v;
  canvas._lastMuted = null; // Force mute redraw on next _drawVolume
  _drawVolume(canvas, v, false);
  fetch("/api/system/volume", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({value:v})}).catch(function(){});
}

function _onVolumeTouchMove(e, canvas) {
  e.stopPropagation();
  if (!canvas._volDragging) return;
  var rect = canvas.getBoundingClientRect();
  var x = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) * (canvas.width / rect.width);
  var v = Math.round(((x - canvas._volMargin) / canvas._volBarW) * 100);
  v = Math.max(0, Math.min(100, v));
  canvas._volValue = v;
  // Only redraw slider bar, never touch mute icon during drag
  _drawVolBar(canvas, v, false);
  fetch("/api/system/volume", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({value:v})}).catch(function(){});
}

function _onVolumeTouchEnd(e, canvas) {
  canvas._volDragging = false;
}

function _fetchAndDrawVolume(canvas) {
  // Defaults so touch works immediately
  canvas._volValue = canvas._volValue || 50;
  canvas._volMargin = 4; canvas._volBarW = canvas.width - canvas._muteX - 8 || canvas.width * 0.7;
  canvas._muteX = canvas._muteX || (canvas.width - canvas.height + 2);
  canvas._muteW = canvas._muteW || (canvas.height - 4);
  _drawVolume(canvas, canvas._volValue, false);
  // Fetch actual state from system
  fetch("/api/system/volume").then(function(r){return r.json()}).then(function(d){
    canvas._volValue = d.output_volume; canvas._volMuted = d.output_muted;
    _drawVolume(canvas, d.output_volume, d.output_muted);
  }).catch(function(){ _drawVolume(canvas, canvas._volValue, false); });
}

function _onVolumeTouchStart(e, canvas) {
  e.stopPropagation();
  var rect = canvas.getBoundingClientRect();
  var x = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) * (canvas.width / rect.width);
  var y = ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) * (canvas.height / rect.height);
  // Device selector area
  if (canvas._devBtns && y >= (canvas._devY || 999)) {
    for (var di = 0; di < canvas._devBtns.length; di++) {
      var db = canvas._devBtns[di];
      if (db && x >= db.x && x <= db.x + db.w && y >= db.y && y <= db.y + db.h) {
        fetch("/api/system/audio-output", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:db.name})}).catch(function(){});
        return;
      }
    }
    return;
  }
  // Mute button
  if (x >= (canvas._muteX || 999) && y < (canvas._devY || 999)) {
    fetch("/api/system/mute", {method:"POST"}).then(function(r){return r.json()}).then(function(d){
      canvas._volMuted = d.muted;
      _drawVolume(canvas, canvas._volValue || 50, d.muted, canvas._adevs, canvas._curDev);
    }).catch(function(){});
    return;
  }
  // Slider drag start
  canvas._volDragging = true;
  var v = Math.round(((x - canvas._volMargin) / canvas._volBarW) * 100);
  v = Math.max(0, Math.min(100, v));
  canvas._volValue = v;
  _drawVolumeSlider(canvas, v, !!canvas._volMuted);
  fetch("/api/system/volume", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({value:v})}).catch(function(){});
}

function _onVolumeTouchMove(e, canvas) {
  e.stopPropagation();
  if (!canvas._volDragging) return;
  var rect = canvas.getBoundingClientRect();
  var x = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) * (canvas.width / rect.width);
  var v = Math.round(((x - canvas._volMargin) / canvas._volBarW) * 100);
  v = Math.max(0, Math.min(100, v));
  canvas._volValue = v;
  _drawVolumeSlider(canvas, v, !!canvas._volMuted);
  fetch("/api/system/volume", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({value:v})}).catch(function(){});
}

function _onVolumeTouchEnd(e, canvas) {
  canvas._volDragging = false;
}

function _fetchAndDrawVolume(canvas) {
  canvas._volValue = canvas._volValue || 50;
  canvas._volMuted = canvas._volMuted || false;
  canvas._volMargin = 4; canvas._volBarW = canvas.width - 8;
  _drawVolume(canvas, canvas._volValue, canvas._volMuted, canvas._adevs, canvas._curDev);
  // Fetch volume
  fetch("/api/system/volume").then(function(r){return r.json()}).then(function(d){
    canvas._volValue = d.output_volume; canvas._volMuted = d.output_muted;
    _drawVolume(canvas, d.output_volume, d.output_muted, canvas._adevs, canvas._curDev);
