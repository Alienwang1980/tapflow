<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">

<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:clip;background:#1a1a2e;font-family:-apple-system,sans-serif;color:#eee;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* Flexbox centering — body is the centering container */
body{display:flex;align-items:center;justify-content:center}
/* Canvas container — scaled to fit viewport, centered by flexbox */
.canvas-wrap{flex-shrink:0;transform-origin:center center}
/* Fixed-size canvas at device dimensions */
.canvas{position:relative}
.key-btn{position:absolute;border:none;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:500;transition:transform 0.04s;overflow:hidden}
.key-btn{transition:transform 0.08s ease,box-shadow 0.08s ease,filter 0.08s ease}.key-btn:active,.key-btn.active{transform:scale(0.93);filter:brightness(1.4);box-shadow:0 2px 8px rgba(255,255,255,0.3)}.key-btn.touchpad{border:1px solid rgba(255,255,255,0.06);opacity:0.9}.key-btn.touchpad:active,.key-btn.dock:active,.key-btn.volume:active,.key-btn.win-switcher:active{transform:none!important;filter:none!important;box-shadow:none!important}.key-btn.touchpad.active,.key-btn.dock.active,.key-btn.volume.active{transform:none!important;filter:none!important;box-shadow:none!important}

const SND={none:null,click:[800,0.06,"square",0.3],soft:[400,0.08,"sine",0.2],mechanical:[1200,0.04,"square",0.4],deep:[200,0.1,"triangle",0.5],red:[300,0.04,"sine",0.15],topre:[500,0.07,"sine",0.18,900,0.008],glass:[2400,0.05,"sine",0.12],bubble:[600,0.06,"sine",0.22,"sweep"],blip:[440,0.05,"square",0.2,"sweep"],spark:[3000,0.02,"sawtooth",0.1,0.4],quit:[600,0.18,"sawtooth",0.22,300,0.1]};

function _drawSpectrum(canvas,bands){var ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);if(!bands||!bands.length){ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(0,0,w,h);ctx.fillStyle="#4ade80";var fs=Math.max(11,Math.min(h*0.18,w*0.05));ctx.font=fs+"px -apple-system,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("Audio Spectrum",w/2,h/2);return}var n=bands.length,bw=Math.max(2,(w-n*2)/n);for(var i=0;i<n;i++){var bh=bands[i]*h*0.9,x=i*(bw+2)+2,y=h-bh,g=ctx.createLinearGradient(x,y,x,h);g.addColorStop(0,"#4ade80");g.addColorStop(1,"rgba(74,222,128,0.15)");ctx.fillStyle=g;ctx.fillRect(x,y,bw,bh)}}

function _drawBalance(canvas,data,label,showFlags){var ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);if(!data||label){ctx.fillStyle="#f59e0b";var fs=Math.max(12,Math.min(h*0.30,w*0.08));ctx.font="bold "+fs+"px -apple-system,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(label||"No data",w/2,h/2);return}var total=parseFloat(data.total_balance)||0,granted=parseFloat(data.granted_balance)||0,topped=parseFloat(data.topped_balance)||0,currency=data.currency||"CNY";var showAll=!showFlags;var showTotal=showAll||showFlags.total!==false;var showTopped=showAll||showFlags.topped!==false;var showGranted=showAll||showFlags.granted!==false;var hasBot=showTopped||showGranted;var pad=Math.max(6,w*0.05);ctx.fillStyle="#f59e0b";var tFs=Math.max(9,Math.min(h*0.13,w*0.05));ctx.font="bold "+tFs+"px -apple-system,sans-serif";ctx.textAlign="left";ctx.textBaseline="top";ctx.fillText("Deepseek",pad,h*0.04);if(showTotal){var hFs=hasBot?Math.max(14,Math.min(h*0.36,w*0.11)):Math.max(16,Math.min(h*0.48,w*0.13));var hY=hasBot?h*0.22:h*0.36;ctx.fillStyle="#e8e0d8";ctx.font="bold "+hFs+"px -apple-system,sans-serif";ctx.fillText(currency+" "+total.toFixed(2),pad,hY);ctx.fillStyle="#8b8078";var sFs=Math.max(8,Math.min(h*0.09,w*0.035));ctx.font=sFs+"px -apple-system,sans-serif";ctx.fillText("total balance",pad,hY+hFs+2);}if(hasBot){var bY=h*0.64;var bFs=Math.max(10,Math.min(h*0.15,w*0.05));ctx.font=bFs+"px -apple-system,sans-serif";ctx.textBaseline="middle";if(showTopped){ctx.fillStyle="#f59e0b";ctx.textAlign="left";ctx.fillText("Topped up",pad,bY);ctx.fillStyle="#e8e0d8";ctx.textAlign="right";ctx.fillText(currency+" "+topped.toFixed(2),w-pad,bY);bY+=h*0.19}if(showGranted){ctx.fillStyle="#8b8078";ctx.textAlign="left";ctx.fillText("Granted",pad,bY);ctx.fillStyle="#e8e0d8";ctx.textAlign="right";ctx.fillText(currency+" "+granted.toFixed(2),w-pad,bY)}}}
function psnd(n){if(!n||n==="none")return;const s=SND[n];if(!s)return;try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type=s[2];if(s[4]==="sweep"){o.frequency.setValueAtTime(s[0]*1.5,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(s[0]*0.5,ctx.currentTime+s[1])}else{o.frequency.setValueAtTime(s[0],ctx.currentTime)}g.gain.setValueAtTime(s[3],ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+s[1]);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+s[1]);if(s.length===6){const o2=ctx.createOscillator(),g2=ctx.createGain();o2.type="square";o2.frequency.setValueAtTime(s[4],ctx.currentTime+0.003);g2.gain.setValueAtTime(s[3]*0.5,ctx.currentTime+0.003);g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+s[5]);o2.connect(g2);g2.connect(ctx.destination);o2.start(ctx.currentTime+0.003);o2.stop(ctx.currentTime+s[5])}if(s.length===5&&typeof s[4]==="number"){const bs=ctx.sampleRate*s[1],buf=ctx.createBuffer(1,bs,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*s[4];const ns=ctx.createBufferSource(),gn=ctx.createGain();ns.buffer=buf;gn.gain.setValueAtTime(s[3]*0.3,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+s[1]*0.5);ns.connect(gn);gn.connect(ctx.destination);ns.start(ctx.currentTime)}}catch(e){}}
// ── Media Control Widgets (volume, mute, mic-mute, audio devices) ──
function _roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath()}

// ── Volume Widget — full-surface progress bar, mute on left, H/V layout ──
function _drawVolumeWidget(canvas,value,muted,layout){var ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);var kc=canvas._keyColor||"#1a2a2a";ctx.fillStyle=kc;ctx.fillRect(0,0,w,h);var isVert=layout==="vertical";var pct=muted?0:Math.round(value);var bc=canvas._volBarColor||"#4ade80";var b30=_hexToRgba(bc,0.30)||"rgba(74,222,128,0.30)";var b22=_hexToRgba(bc,0.22)||"rgba(34,197,94,0.22)";if(isVert){var fillH=h*(pct/100);if(fillH>0.5){var g=ctx.createLinearGradient(0,h,0,0);g.addColorStop(0,b30);g.addColorStop(1,b22);ctx.fillStyle=g;ctx.fillRect(0,h-fillH,w,fillH)}}else{var fillW=w*(pct/100);if(fillW>0.5){var g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,b30);g.addColorStop(1,b22);ctx.fillStyle=g;ctx.fillRect(0,0,fillW,h)}}var cx=w/2,cy=h/2;var baseR=Math.min(w,h)*0.32;var ic=canvas._volIconColor||"#999999";var mc=muted?"#ef4444":ic;var mc30=_hexToRgba(mc,0.30)||"rgba(153,153,153,0.30)";ctx.beginPath();ctx.arc(cx,cy,baseR,0,Math.PI*2);ctx.fillStyle=mc30;ctx.fill();ctx.beginPath();ctx.arc(cx,cy,baseR,0,Math.PI*2);ctx.strokeStyle=mc30;ctx.lineWidth=1.5;ctx.stroke();var isz=baseR*1.3;if(!canvas._volOnImg){canvas._volOnImg=new Image();canvas._volOnImg.src="/static/volume-notice.svg";canvas._volOffImg=new Image();canvas._volOffImg.src="/static/volume-mute.svg"}var img=muted?canvas._volOffImg:canvas._volOnImg;if(img&&img.complete&&img.naturalWidth>0){var tinted=_tintIcon(img,isz,isz,mc);ctx.drawImage(tinted,cx-isz/2,cy-isz/2)}else{_drawSpeakerIcon(ctx,cx-isz/2,cy-isz/2,isz,muted)}canvas._volValue=value;canvas._volMuted=muted;canvas._volLayout=layout||"horizontal";canvas._volBarLen=isVert?h:w}
function _drawSpeakerIcon(ctx,x,y,sz,muted){var s=sz;ctx.fillStyle=muted?"#ef4444":"#999";ctx.fillRect(x+s*0.10,y+s*0.28,s*0.20,s*0.44);ctx.beginPath();ctx.moveTo(x+s*0.30,y+s*0.20);ctx.lineTo(x+s*0.55,y+s*0.08);ctx.lineTo(x+s*0.55,y+s*0.92);ctx.lineTo(x+s*0.30,y+s*0.80);ctx.closePath();ctx.fill();if(!muted){ctx.strokeStyle="#999";ctx.lineWidth=Math.max(1,s*0.05);ctx.beginPath();ctx.arc(x+s*0.52,y+s*0.5,s*0.20,-0.40,0.40);ctx.stroke();ctx.beginPath();ctx.arc(x+s*0.52,y+s*0.5,s*0.32,-0.40,0.40);ctx.stroke()}if(muted){ctx.strokeStyle="#ef4444";ctx.lineWidth=Math.max(1.2,s*0.07);ctx.beginPath();ctx.moveTo(x+s*0.48,y+s*0.24);ctx.lineTo(x+s*0.68,y+s*0.78);ctx.moveTo(x+s*0.68,y+s*0.24);ctx.lineTo(x+s*0.48,y+s*0.78);ctx.stroke()}}
function _onVolumeTouchStart(e,canvas){e.stopPropagation();var rect=canvas.getBoundingClientRect();var tx=((e.touches?e.touches[0].clientX:e.clientX)-rect.left)*(canvas.width/rect.width);var ty=((e.touches?e.touches[0].clientY:e.clientY)-rect.top)*(canvas.height/rect.height);canvas._volTapped=true;canvas._volDragging=false;canvas._volBase=canvas._volValue||50;canvas._volStartX=tx;canvas._volStartY=ty}
function _onVolumeTouchMove(e,canvas){e.stopPropagation();var rect=canvas.getBoundingClientRect();var tx=((e.touches?e.touches[0].clientX:e.clientX)-rect.left)*(canvas.width/rect.width);var ty=((e.touches?e.touches[0].clientY:e.clientY)-rect.top)*(canvas.height/rect.height);var dx=tx-canvas._volStartX,dy=ty-canvas._volStartY;if(Math.sqrt(dx*dx+dy*dy)>5){canvas._volTapped=false;canvas._volDragging=true}if(!canvas._volDragging)return;var isVert=canvas._volLayout==="vertical";var curPos=isVert?ty:tx;var delta=isVert?(canvas._volStartY-curPos):(curPos-canvas._volStartX);var sens=canvas._volBarLen*0.8;var v=Math.round(canvas._volBase+delta/sens*100);v=Math.max(0,Math.min(100,v));canvas._volValue=v;_drawVolumeWidget(canvas,v,false,canvas._volLayout)}

// ── Mic Mute Widget — circular with expanding rings, mic icon, animated level ──
function _drawMicIcon(ctx,cx,cy,sz,muted){var s=sz;var c=muted?"#ef4444":"#999";ctx.fillStyle=c;var rw=s*0.16,rh=s*0.48;var rx=cx-rw/2,ry=cy-rh*0.55;ctx.beginPath();ctx.moveTo(rx+rw/2,ry);ctx.arcTo(rx+rw,ry,rx+rw,ry+rw/2,rw/2);ctx.lineTo(rx+rw,ry+rh-rw/2);ctx.arcTo(rx+rw,ry+rh,rx+rw/2,ry+rh,rw/2);ctx.lineTo(rx,ry+rh);ctx.arcTo(rx-rw/2,ry+rh,rx-rw/2,ry+rh-rw/2,rw/2);ctx.lineTo(rx-rw/2,ry+rw/2);ctx.arcTo(rx-rw/2,ry,rx,ry,rw/2);ctx.closePath();ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=Math.max(1,s*0.04);for(var i=0;i<3;i++){var ly=ry+rh*0.25+i*rh*0.23;ctx.beginPath();ctx.moveTo(cx-rw*0.35,ly);ctx.lineTo(cx+rw*0.35,ly);ctx.stroke()}ctx.beginPath();ctx.arc(cx,ry+rh+s*0.08,s*0.20,Math.PI*0.15,Math.PI*0.85);ctx.strokeStyle=c;ctx.lineWidth=Math.max(1.2,s*0.05);ctx.stroke();if(muted){ctx.strokeStyle="#ef4444";ctx.lineWidth=Math.max(1.5,s*0.07);ctx.beginPath();ctx.moveTo(cx-s*0.25,cy-s*0.42);ctx.lineTo(cx+s*0.25,cy+s*0.45);ctx.moveTo(cx+s*0.25,cy-s*0.42);ctx.lineTo(cx-s*0.25,cy+s*0.45);ctx.stroke()}}

function _drawMicMuteBtn(canvas,muted,level){var ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);var kc=canvas._keyColor||"#1a2a2a";ctx.fillStyle=kc;ctx.fillRect(0,0,w,h);var cx=w/2,cy=h/2;var baseR=Math.min(w,h)*0.32;var raw=level||0;var lvl=Math.min(1,raw);var mc=canvas._micColor||"#999999";var lc=canvas._micLevelColor||"#4ade80";if(muted){lc="#ef4444";mc="#ef4444"}for(var ring=0;ring<3;ring++){var threshold=ring*0.30;var ringAlpha=Math.max(0,Math.min(1,(lvl-threshold)/0.30));if(ringAlpha>0.01){var ringR=baseR+4+ring*8+ringAlpha*6;ctx.beginPath();ctx.arc(cx,cy,ringR,0,Math.PI*2);ctx.strokeStyle=_hexToRgba(lc,0.15+ringAlpha*0.4)||"rgba(74,222,128,"+(0.15+ringAlpha*0.4)+")";ctx.lineWidth=2+ringAlpha*1.5;ctx.stroke()}}ctx.beginPath();ctx.arc(cx,cy,baseR,0,Math.PI*2);ctx.fillStyle=_hexToRgba(mc,0.30)||"rgba(153,153,153,0.30)";ctx.fill();ctx.beginPath();ctx.arc(cx,cy,baseR,0,Math.PI*2);ctx.strokeStyle=_hexToRgba(mc,0.30)||"rgba(153,153,153,0.30)";ctx.lineWidth=1.5;ctx.stroke();var isz=baseR*1.3;if(!canvas._micOnImg){canvas._micOnImg=new Image();canvas._micOnImg.src="/static/voice.svg";canvas._micOffImg=new Image();canvas._micOffImg.src="/static/voice-off.svg"}var img=muted?canvas._micOffImg:canvas._micOnImg;if(img&&img.complete&&img.naturalWidth>0){var tinted=_tintIcon(img,isz,isz,mc);ctx.drawImage(tinted,cx-isz/2,cy-isz/2)}else{_drawMicIcon(ctx,cx,cy,isz,muted)}canvas._micMuted=muted;canvas._micLevel=raw}
function _toggleMicMute(canvas){fetch("/api/system/mic-mute",{method:"POST"}).then(function(r){return r.json()}).then(function(d){canvas._micTarget=0;canvas._micAnimating=false;_drawMicMuteBtn(canvas,d.muted,canvas._micLevel||0)})}

async function _showProfilePopup(currentFn){
  try{
    var r=await fetch("/api/profiles");
    var list=(await r.json()).profiles||[];
    var ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:40px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)";
    ov.addEventListener("touchstart",function(e){if(e.target===ov){e.stopPropagation();ov.remove()}});
    var ti=document.createElement("div");
    ti.style.cssText="color:#fff;font-size:18px;font-weight:600;margin-bottom:12px";
    ti.textContent="Switch Profile";
    ov.appendChild(ti);
    list.forEach(function(p){
      var btn=document.createElement("button");
      btn.textContent=p.profileName+(p.filename===currentFn?" (current)":"");
      btn.style.cssText="width:260px;padding:14px 20px;font-size:16px;font-weight:500;border-radius:12px;border:1px solid rgba(255,255,255,0.12);cursor:pointer;background:"+(p.filename===currentFn?"rgba(74,222,128,0.2)":"rgba(255,255,255,0.08)")+";color:#fff";
      btn.addEventListener("touchstart",function(e){e.stopPropagation();e.preventDefault();ov.remove();switchToProfile(p.filename)});
      ov.appendChild(btn);
    });
    var cancel=document.createElement("button");
    cancel.textContent="Cancel";
    cancel.style.cssText="width:260px;padding:12px;font-size:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);cursor:pointer;background:rgba(255,255,255,0.04);color:#888;margin-top:8px";
    cancel.addEventListener("touchstart",function(e){e.stopPropagation();e.preventDefault();ov.remove()});
    ov.appendChild(cancel);
    document.body.appendChild(ov);
  }catch(e){}
}
async function switchToProfile(fn){
  try{
    const r=await fetch("/api/profiles/"+fn);
    if(!r.ok){console.log("switchToProfile fetch failed:",fn);return}
    profile=await r.json();
    activeProfile=fn;
    activePage=profile.pages[0]?.id||"";
    profileLoaded=true;
    active.clear();
    for(var _tk in touchKey)delete touchKey[_tk];
    render();
    fetch("/api/active-profile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({filename:fn})}).catch(function(){});
  }catch(e){console.log("switchToProfile error:",e)}
}
async function load(){
  try{const r=await fetch("/api/active-profile");const d=await r.json();profile=d.profile;activeProfile=d.filename||"Default.json";activePage=profile.pages[0]?.id||"";profileLoaded=true;render()}catch(e){}
  conn();
