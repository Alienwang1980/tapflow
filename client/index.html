<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Smart Touch Panel</title>
<style>
:root {
  --bg: #1a1a2e; --panel-bg: #16213e; --key-default: #0f3460;
  --key-active: #e94560; --text: #eee; --text-dim: #888;
  --border: #2a2a4a; --accent: #e94560;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 8px; background: var(--panel-bg);
  border-bottom: 1px solid var(--border); height: 36px; flex-shrink: 0;
}
.top-bar h1 { font-size: 14px; font-weight: 600; }
.top-bar h1 span { color: var(--accent); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 3px; }
.status-dot.connect { background: #4caf50; }
.status-dot.disconnect { background: #f44336; }
.status-dot.connecting { background: #ff9800; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.status-text { font-size: 10px; color: var(--text-dim); }
.top-actions { display: flex; gap: 4px; align-items: center; }
.top-actions select {
  background: var(--key-default); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 6px; font-size: 11px; cursor: pointer; max-width: 120px;
}
.top-actions button {
  background: var(--key-default); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 6px; font-size: 11px; cursor: pointer;
}
.tabs {
  display: flex; gap: 1px; padding: 3px 4px; background: var(--bg);
  overflow-x: auto; -webkit-overflow-scrolling: touch; flex-shrink: 0;
}
.tab-btn {
  padding: 4px 10px; border-radius: 5px 5px 0 0;
  background: var(--panel-bg); color: var(--text-dim); border: none;
  font-size: 11px; font-weight: 500; cursor: pointer; white-space: nowrap; touch-action: manipulation;
}
.tab-btn.active { background: var(--key-default); color: var(--text); }
.grid-wrap { flex: 1; overflow-y: auto; padding: 3px; -webkit-overflow-scrolling: touch; }
.key-grid { display: grid; gap: 3px; }
.key-btn {
  position: relative; background: var(--key-default);
  border: 1px solid var(--border); border-radius: 5px;
  color: var(--text); font-size: 13px; font-weight: 500;
  min-height: 28px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; touch-action: none;
  transition: transform 0.04s, background 0.04s;
  -webkit-tap-highlight-color: transparent;
}
.key-btn:active, .key-btn.active {
  background: var(--key-active); transform: scale(0.92); border-color: var(--accent);
}
.key-label { pointer-events: none; text-align: center; line-height: 1.1; font-size: inherit; overflow: hidden; text-overflow: ellipsis; }

.qr-modal {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center;
}
.qr-modal.open { display: flex; }
.qr-card {
  background: var(--panel-bg); border: 2px solid var(--accent);
  border-radius: 12px; padding: 20px; text-align: center; max-width: 300px;
}
.qr-card h2 { font-size: 16px; margin-bottom: 10px; }
.qr-card .url { font-size: 14px; color: var(--accent); word-break: break-all; margin-bottom: 10px; }
.qr-card img { margin: 8px auto; display: block; }
.qr-card button {
  padding: 6px 16px; background: var(--accent); color: #fff;
  border: none; border-radius: 5px; font-size: 13px; cursor: pointer;
}
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  body { padding-bottom: env(safe-area-inset-bottom); }
}
</style>
</head>
<body>
<div class="top-bar">
  <h1>Smart <span>Touch</span></h1>
  <div class="top-actions">
    <select id="profileSelect" onchange="onProfileChange()"></select>
    <span class="status-dot connecting" id="statusDot"></span>
    <span class="status-text" id="statusText">connecting</span>
    <button onclick="showQR()">QR</button>
  </div>
</div>
<div class="tabs" id="tabs"></div>
<div class="grid-wrap"><div class="key-grid" id="keyGrid"></div></div>

<div class="qr-modal" id="qrModal" onclick="closeQR(event)">
  <div class="qr-card" onclick="event.stopPropagation()">
    <h2>Scan to Connect</h2>
    <div class="url" id="qrUrl"></div>
    <img id="qrImg" src="" alt="QR Code" width="180" height="180">
    <button onclick="closeQR()">Close</button>
  </div>
</div>

<script>
"use strict";
let ws=null, profile=null, profiles=[], activePageId="", activeProfileFile="Default.json";
let reconnectTimer=null, reconnectDelay=1000;

function connect(){
  const proto=location.protocol==="https:"?"wss:":"ws:";
  ws=new WebSocket(proto+"//"+location.hostname+":8082/ws");
  ws.onopen=()=>{setStatus("connect","connected");reconnectDelay=1000;};
  ws.onmessage=(e)=>{
    const m=JSON.parse(e.data);
    if(m.type==="profile"){profile=m.profile;activeProfileFile=m.filename||"Default.json";if(!activePageId||!profile.pages.find(p=>p.id===activePageId))activePageId=profile.pages[0]?.id||"";loadProfileList();renderAll();}
    else if(m.type==="profile_update"){profile=m.profile;activeProfileFile=m.filename||activeProfileFile;if(!activePageId||!profile.pages.find(p=>p.id===activePageId))activePageId=profile.pages[0]?.id||"";loadProfileList();renderAll();}
    else if(m.type==="profile_switch"){activePageId=m.page||activePageId;renderAll();}
  };
  ws.onclose=()=>{setStatus("disconnect","disconnected");scheduleReconnect();};
  ws.onerror=()=>{setStatus("disconnect","error");};
}
function scheduleReconnect(){clearTimeout(reconnectTimer);setStatus("connecting","retry "+Math.round(reconnectDelay/1000)+"s");reconnectTimer=setTimeout(()=>{reconnectDelay=Math.min(reconnectDelay*1.5,15000);connect();},reconnectDelay);}
function setStatus(cls,text){document.getElementById("statusDot").className="status-dot "+cls;document.getElementById("statusText").textContent=text;}

function sendKey(keyDef){
  if(!ws||ws.readyState!==WebSocket.OPEN)return;
  ws.send(JSON.stringify({type:"key",key:keyDef.value,action:keyDef.action==="text"?"text":"press"}));
}

// Multi-touch
const activeTouches=new Set();
document.addEventListener("touchstart",e=>{
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i],el=document.elementFromPoint(t.clientX,t.clientY);
    if(el?.classList.contains("key-btn")){
      const kid=el.dataset.keyId;
      if(kid&&!activeTouches.has(kid)){activeTouches.add(kid);el.classList.add("active");
        const page=profile?.pages.find(p=>p.id===activePageId),kd=page?.keys.find(k=>k.id===kid);
        if(kd)sendKey(kd);}
    }
  }
},{passive:false});
document.addEventListener("touchend",e=>{
  e.preventDefault();
  activeTouches.forEach(kid=>{const btn=document.querySelector('[data-key-id="'+kid+'"]');if(btn)btn.classList.remove("active");});
  activeTouches.clear();
},{passive:false});
document.addEventListener("touchmove",e=>{e.preventDefault();},{passive:false});
document.addEventListener("click",e=>{
  const el=e.target.closest(".key-btn");if(!el)return;
  const page=profile?.pages.find(p=>p.id===activePageId),kd=page?.keys.find(k=>k.id===el.dataset.keyId);
  if(kd)sendKey(kd);
});

function renderAll(){renderTabs();renderGrid();}
function renderTabs(){
  document.getElementById("tabs").innerHTML=(profile?.pages||[]).map(p=>
    '<button class="tab-btn'+(p.id===activePageId?" active":"")+'" onclick="switchPage(\''+p.id+'\')">'+p.label+'</button>'
  ).join("");
}
function renderGrid(){
  const grid=document.getElementById("keyGrid"),page=profile?.pages.find(p=>p.id===activePageId);
  if(!page){grid.innerHTML="";return;}
  const cols=page.columns||15, rows=page.rows||8;

  // Check if keys have grid positions
  const hasPositions=page.keys.some(k=>k.col!==undefined&&k.row!==undefined);

  if(hasPositions){
    // ── Grid positioning mode ──
    grid.style.gridTemplateColumns="repeat("+cols+", 1fr)";
    grid.style.gridTemplateRows="repeat("+rows+", 1fr)";
    grid.style.minHeight=(rows*44)+"px";
    grid.innerHTML=page.keys.map(k=>{
      const col=k.col||1,row=k.row||1,w=k.w||1,h=k.h||1;
      return '<button class="key-btn" data-key-id="'+k.id+'" '+
        'style="background:'+(k.color||'var(--key-default)')+';grid-column:'+col+'/span '+w+';grid-row:'+row+'/span '+h+'"'+
        '><span class="key-label">'+h_(k.label)+'</span></button>';
    }).join("");
  } else {
    // ── Legacy sequential flow ──
    grid.style.gridTemplateColumns="repeat("+cols+", 1fr)";
    grid.style.gridTemplateRows="";
    grid.style.minHeight="";
    grid.innerHTML=page.keys.map(k=>{
      const w=k.w||1;
      return '<button class="key-btn" data-key-id="'+k.id+'" '+
        'style="background:'+(k.color||'var(--key-default)')+';grid-column:span '+w+'"'+
        '><span class="key-label">'+h_(k.label)+'</span></button>';
    }).join("");
  }
}
function switchPage(pageId){activePageId=pageId;renderAll();}

async function loadProfileList(){
  try{const r=await fetch("/api/profiles");profiles=((await r.json()).profiles||[]);
    document.getElementById("profileSelect").innerHTML=profiles.map(p=>
      '<option value="'+p.filename+'"'+(p.filename===activeProfileFile?" selected":"")+'>'+p.profileName+'</option>'
    ).join("");
  }catch(e){}
}
async function onProfileChange(){
  const fn=document.getElementById("profileSelect").value;
  try{const r=await fetch("/api/profiles/"+fn);if(!r.ok)return;
    profile=await r.json();activeProfileFile=fn;activePageId=profile.pages[0]?.id||"";renderAll();
  }catch(e){}
}

function showQR(){
  document.getElementById("qrModal").classList.add("open");
  const url="http://"+location.hostname+":8082";
  document.getElementById("qrUrl").textContent=url;
  document.getElementById("qrImg").src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+encodeURIComponent(url);
}
function closeQR(e){if(!e||e.target===document.getElementById("qrModal"))document.getElementById("qrModal").classList.remove("open");}
function h_(s){return(String(s||"")).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}

connect();
</script>
</body>
</html>
