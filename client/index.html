<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Smart Touch Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:-apple-system,sans-serif;color:#eee;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

.top-bar h1{font-size:13px}.top-bar span{color:#e94560}





50%{opacity:0.3}}




/* Canvas container — centered, scaled to fit viewport */
.canvas-wrap{position:fixed;top:50%;left:50%;transform-origin:0 0;z-index:1}
/* Fixed-size canvas at device dimensions */
.canvas{position:relative;overflow:hidden}
.key-btn{position:absolute;border:none;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:${Math.max(8,cs*0.25)}px;font-weight:500;transition:transform 0.04s;overflow:hidden}
.key-btn:active,.key-btn.active{transform:scale(0.93)}
.info{display:none;position:fixed;bottom:4px;left:4px;color:#fff;font-size:10px;z-index:99;background:rgba(0,0,0,0.85);padding:5px 8px;border-radius:4px;user-select:text;-webkit-user-select:text}
</style></head>
<body>


<div class="canvas-wrap" id="wrap"><div class="canvas" id="canvas"></div></div>
<div id="info" class="info"></div>
<script>
"use strict";
let profile=null,activePage="",activeProfile="Default.json";
let ws=null,timer=null,delay=1000;

// ── Sound ──
const SND={none:null,click:[800,0.06,"square",0.3],soft:[400,0.08,"sine",0.2],mechanical:[1200,0.04,"square",0.4],deep:[200,0.1,"triangle",0.5]};
let ctx=null;
function psnd(n){if(!n||n==="none")return;const s=SND[n];if(!s)return;try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=s[2];o.frequency.setValueAtTime(s[0],ctx.currentTime);g.gain.setValueAtTime(s[3],ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+s[1]);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+s[1])}catch(e){}}

// ── WebSocket ──
function conn(){
  const p=location.protocol==="https:"?"wss:":"ws:";
  ws=new WebSocket(p+"//"+location.hostname+":8082/ws");
  ws.onopen=()=>{ss("on");delay=1000};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="profile"||m.type==="profile_update"){profile=m.profile;activeProfile=m.filename||activeProfile;activePage=profile.pages.find(p=>p.id===activePage)?activePage:(profile.pages[0]?.id||"");render()}else if(m.type==="profile_switch"){activePage=m.page||activePage;render()}};
  ws.onclose=()=>{timer=setTimeout(()=>{delay=Math.min(delay*1.5,15000);conn()},delay)};
  ws.onerror=()=>{};
}


// ── Send key ──


// ── Touch events ──
const active=new Set();let touchUsed=false;
document.addEventListener("touchstart",e=>{e.preventDefault();touchUsed=true;for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i],el=document.elementFromPoint(t.clientX,t.clientY);if(el?.classList.contains("key-btn")){const kid=el.dataset.keyId;if(kid&&!active.has(kid)){active.add(kid);el.classList.add("active");const pg=profile?.pages.find(p=>p.id===activePage),kd=pg?.keys.find(k=>k.id===kid);if(kd){psnd(kd.sound||(profile&&profile.defaultSound)||"none");if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"key",key:kd.value,action:"down"}))}}}}},{passive:false});
document.addEventListener("touchend",e=>{e.preventDefault();for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i],el=document.elementFromPoint(t.clientX,t.clientY);if(el?.classList.contains("key-btn")){const kid=el.dataset.keyId;if(kid){active.delete(kid);el.classList.remove("active");const pg=profile?.pages.find(p=>p.id===activePage),kd=pg?.keys.find(k=>k.id===kid);if(kd&&ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"key",key:kd.value,action:"up"}))}}}},{passive:false});
document.addEventListener("touchmove",e=>{e.preventDefault();for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i],el=document.elementFromPoint(t.clientX,t.clientY);if(el?.classList.contains("key-btn")){const kid=el.dataset.keyId;if(kid&&!active.has(kid)){active.add(kid);el.classList.add("active");const pg=profile?.pages.find(p=>p.id===activePage),kd=pg?.keys.find(k=>k.id===kid);if(kd){psnd(kd.sound||(profile&&profile.defaultSound)||"none");if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"key",key:kd.value,action:"down"}))}}}}},{passive:false});
document.addEventListener("click",e=>{if(touchUsed){touchUsed=false;return}const el=e.target.closest(".key-btn");if(!el)return;const pg=profile?.pages.find(p=>p.id===activePage),kd=pg?.keys.find(k=>k.id===el.dataset.keyId);if(kd&&ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify({type:"key",key:kd.value,action:"press"}));psnd(kd.sound||(profile&&profile.defaultSound)||"none")}});

// ── Render — CSS transform scale approach ──
function render(){
  const pg=profile?.pages.find(p=>p.id===activePage);if(!pg)return;
  const dw=profile.deviceWidth||834,dh=profile.deviceHeight||1210,cs=profile.cellSize||60;
  const cx=profile.canvasX||0,cy=profile.canvasY||0;
  const vw=window.innerWidth,vh=window.innerHeight;

  // Scale canvas to fit viewport
  const scale=Math.min(vw/dw,vh/dh);
  const wrap=document.getElementById("wrap");
  wrap.style.width=dw+"px";wrap.style.height=dh+"px";
  wrap.style.transform=`translate(-50%,-50%) scale(${scale})`;

  // Set canvas size
  const canvas=document.getElementById("canvas");
  canvas.style.width=dw+"px";canvas.style.height=dh+"px";

  // Render keys at fixed device coordinates
  const padX=dw/(2*cs),padY=dh/(2*cs);
  canvas.innerHTML="";
  let vis=0;
  pg.keys.forEach(k=>{
    const px=cs*1; // 1:1 in device coordinates (scale handles resizing)
    const x=(k.col+padX+cx)*px; // cx in grid cells
    const y=(k.row+padY+cy)*px;
    const kw=k.w*px-3,kh=k.h*px-3;
    if(x+kw>0&&y+kh>0&&x<dw&&y<dh)vis++;
    const el=document.createElement("div");el.className="key-btn";el.dataset.keyId=k.id;
    el.style.cssText=`left:${x}px;top:${y}px;width:${kw}px;height:${kh}px;background:${k.color||'#0f3460'};font-size:${Math.max(8,cs*0.25)}px`;
    el.textContent=k.label;canvas.appendChild(el);
  });
  document.getElementById("info").textContent=`${vis}/${pg.keys.length} | ${dw}x${dh} cs=${cs} cx=${cx} s=${scale.toFixed(3)} vw=${vw}x${vh}`;
}

window.addEventListener("resize",render);
window.addEventListener("orientationchange",()=>setTimeout(render,300));

// ── Load ──
async function load(){
  try{const r=await fetch("/api/profiles/Default.json");profile=await r.json();activeProfile="Default.json";activePage=profile.pages[0]?.id||"";render()}catch(e){}
  conn();
}



load();
</script></body></html>
